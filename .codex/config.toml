[projects."/home/okshin/src/github.com/okshin-yk-private/serverlessBlog"]
trust_level = "trusted"


# BEGIN AI-MCP
[mcp_servers."aws-mcp"]
command = "uvx"
args = ["mcp-proxy-for-aws@latest", "https://aws-mcp.us-east-1.api.aws/mcp", "--metadata", "AWS_REGION=us-west-2"]

[mcp_servers."awslabs_aws-iac-mcp-server"]
command = "uvx"
args = ["--from", "awslabs.aws-iac-mcp-server@latest", "awslabs.aws-iac-mcp-server"]
[mcp_servers."awslabs_aws-iac-mcp-server".env]
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers."playwright-test"]
command = "npx"
args = ["playwright", "run-test-mcp-server"]

[mcp_servers."sequential-thinking"]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers."terraform-mcp-server"]
command = "docker"
args = ["run", "-i", "--rm", "hashicorp/terraform-mcp-server"]
# END AI-MCP
