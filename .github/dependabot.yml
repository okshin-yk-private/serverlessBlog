# Dependabot configuration
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Phase 1 (visibility): weekly grouped PRs for minor/patch updates; majors are reviewed manually.
# Bun supports version updates, but not automatic security-update PRs.
# Security Scan audits every bun.lock independently of this schedule.
#
# Schedule strategy:
#   Spread weekly runs across Mon–Sat to avoid the GitHub Code Scanning API rate
#   limit (5,000 req/h per installation) when many ecosystems open PRs concurrently.
#   Times are staggered by 1h within each day for the same reason.
#
# Bun's native ecosystem updates package.json and the text bun.lock together.
# https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories
# See docs/SECURITY_SCANNING.md for review and security-update limitations.

version: 2

updates:
  # ============================================================
  # JavaScript / TypeScript (native Bun ecosystem) — Monday
  # ============================================================
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/frontend/public-astro"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/frontend/admin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/scripts/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "deploy-scripts"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # Go (Lambda functions) — Tuesday
  # ============================================================
  - package-ecosystem: "gomod"
    directory: "/go-functions"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # Terraform (all root and module directories) — Thursday
  # ============================================================
  # All root modules pin the same providers, so one entry with group-by:
  # dependency-name opens a single PR per dependency across every directory
  # instead of one PR per directory or per environment. develop requires
  # up-to-date branches, so each extra PR meant another update-branch + CI
  # cycle (#716). group-by covers version updates only.
  #
  # `/terraform/environments/dev` and `/terraform/environments/prd` moved here
  # from their own Wednesday entries (#742): they used to open separate,
  # ungrouped PRs, so the same provider bump landed as several PRs across two
  # days. `/terraform`, `/terraform/examples/complete` and `/terraform/bootstrap`
  # were previously uncovered entirely, so their lock files drifted to older
  # provider versions (#742, #685 item 8). Each listed path has its own
  # .terraform.lock.hcl; we expect `/terraform` to be scanned as its own root
  # rather than recursively (GitHub's docs don't state this — verify on the
  # first Thursday run that no lock file is updated twice). `/terraform/bootstrap` is included for lock-file updates
  # only (no remote backend); see the "Dependency updates" section of
  # docs/SECURITY_SCANNING.md for why a bootstrap update PR is safe without a
  # per-PR plan, and for the import steps required before a manual apply.
  - package-ecosystem: "terraform"
    directories:
      - "/terraform"
      - "/terraform/bootstrap"
      - "/terraform/examples/complete"
      - "/terraform/environments/*"
      - "/terraform/modules/*"
    schedule: { interval: "weekly", day: "thursday", time: "03:00", timezone: "Asia/Tokyo" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "terraform"]
    commit-message: { prefix: "chore(deps)", include: "scope" }
    groups:
      terraform-dependencies:
        patterns: ["*"]
        group-by: dependency-name

  # ============================================================
  # GitHub Actions (workflows + composite actions) — Saturday
  # ============================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "workflow"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-bun-deps"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "workflow"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
