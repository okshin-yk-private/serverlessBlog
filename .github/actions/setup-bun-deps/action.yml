name: 'Setup Bun + Dependencies'
description: 'Setup Bun runtime and install frontend dependencies with caching'
inputs:
  bun-version:
    description: 'Bun version to install'
    default: '1.2.0'
  working-directory:
    description: 'Directory containing package.json'
    default: 'frontend'
runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Cache Bun dependencies
      # Lockfile is bun.lock (text format) — this repo has no bun.lockb anywhere.
      # The cache key is scoped by working-directory so the four bun projects
      # (root, frontend/admin, frontend/public-astro, scripts/deploy) can't
      # restore/overwrite each other's node_modules. Keep both in sync with
      # any future project moves.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.working-directory }}/node_modules
          ~/.bun/install/cache
        key: bun-deps-${{ runner.os }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}
        restore-keys: |
          bun-deps-${{ runner.os }}-${{ inputs.working-directory }}-
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Dependabot only updates package.json (the npm ecosystem doesn't touch
      # bun.lock), so --frozen-lockfile would always fail on its PRs. The
      # dependabot-bun-lockfile workflow regenerates and pushes bun.lock back
      # to the PR; here we just need to let the install succeed so the rest
      # of CI (lint/test/build) can run.
      run: |
        if [[ "${GITHUB_ACTOR}" == "dependabot[bot]" ]]; then
          echo "Dependabot PR: running bun install without --frozen-lockfile"
          bun install --no-summary
        else
          bun install --frozen-lockfile
        fi
