name: 'Setup Bun + Dependencies'
description: 'Setup Bun runtime and install frontend dependencies with caching'
inputs:
  bun-version:
    description: 'Bun version to install'
    default: '1.3.11'
  working-directory:
    description: 'Directory containing package.json'
    default: 'frontend'
runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Cache Bun dependencies
      # Lockfile is bun.lock (text format) — this repo has no bun.lockb anywhere.
      # The cache key is scoped by working-directory so the four bun projects
      # (root, frontend/admin, frontend/public-astro, scripts/deploy) can't
      # restore/overwrite each other's node_modules. Keep both in sync with
      # any future project moves.
      # Restore only an exact lockfile match: Bun can leave obsolete nested
      # packages in node_modules after a fallback restore. v2 discards caches
      # previously populated from a different lockfile.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ inputs.working-directory }}/node_modules
          ~/.bun/install/cache
        key: bun-deps-v2-${{ runner.os }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Native Bun updates include bun.lock. Never test an unrecorded resolution.
      run: bun install --frozen-lockfile
