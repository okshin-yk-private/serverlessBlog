name: 'Setup Terraform + Provider Cache'
description: 'Install Terraform and cache the provider plugin directory shared across jobs'
inputs:
  terraform-version:
    description: 'Terraform version to install'
    required: true
  terraform-wrapper:
    description: 'Whether to install the Terraform wrapper script (hashicorp/setup-terraform terraform_wrapper input)'
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: ${{ inputs.terraform-wrapper }}

    - name: Create Terraform plugin cache dir
      shell: bash
      run: mkdir -p ${{ github.workspace }}/.terraform.d/plugin-cache

    - name: Cache Terraform providers
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ github.workspace }}/.terraform.d/plugin-cache
        key: terraform-providers-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
        restore-keys: |
          terraform-providers-${{ runner.os }}-

    # A composite action cannot set job-level `env`, so TF_PLUGIN_CACHE_DIR
    # must be exported to $GITHUB_ENV here for subsequent steps in the
    # calling job to see it (this mirrors what the removed job-level `env:`
    # block used to provide).
    - name: Export TF_PLUGIN_CACHE_DIR
      shell: bash
      run: echo "TF_PLUGIN_CACHE_DIR=${{ github.workspace }}/.terraform.d/plugin-cache" >> $GITHUB_ENV
