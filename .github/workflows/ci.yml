# Unified CI Workflow with Label-based Conditional Execution
# Requirement R31: GitHub Actions CI/CD
# Requirement R45: 継続的テスト
# Requirement R39: TDD手法、100%テストカバレッジ
#
# This workflow combines comprehensive testing with efficient label-based execution
# Covers: Infrastructure (Terraform/CDK), Backend (Go Lambda), Frontend (React)
#
# Label-based execution:
# - 'terraform' label: Terraform fmt, validate, plan, security-scan
# - 'go' label: Go lint, tests, Lambda builds
# - 'frontend' label: Frontend tests, E2E tests
# - 'infrastructure' label: CDK tests, diff (legacy)

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - develop

# Deduplicate concurrent CI runs for the SAME pull request.
# Dependabot opening a PR, combined with the auto-labeler firing `labeled` /
# `unlabeled` events, launches several CI runs against one commit at nearly the
# same instant. Each run executes Terraform Plan against the shared DEV/PRD
# state backend and races on the S3/DynamoDB state lock, surfacing as a flaky
# "Terraform Plan" failure even though the plan itself is clean.
#
# Scoping the group to the PR number (not a fixed string) keeps plans for
# DIFFERENT PRs running in parallel — they rely on `-lock-timeout` for the
# shared lock — while cancelling only the now-stale earlier runs of THIS same
# PR. This avoids the false cross-PR "cancelled" failures a fixed shared group
# previously caused.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # Required for actions/labeler to add labels
  id-token: write # Required for AWS OIDC authentication

env:
  TERRAFORM_VERSION: '1.14.0'
  AWS_REGION: 'ap-northeast-1'

jobs:
  verify-go-toolchain:
    name: Verify Go Toolchain Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify version sources
        run: scripts/ci/verify-go-toolchain.sh

  # =======================================
  # Job 0: Setup Labels (Auto-label + Check)
  # =======================================
  setup-labels:
    name: Auto-label and Get Labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr-number: ${{ steps.get-pr.outputs.pr-number }}
      has-infrastructure: ${{ steps.check-labels.outputs.has-infrastructure }}
      has-terraform: ${{ steps.check-labels.outputs.has-terraform }}
      has-frontend: ${{ steps.check-labels.outputs.has-frontend }}
      has-tests: ${{ steps.check-labels.outputs.has-tests }}
      has-workflow: ${{ steps.check-labels.outputs.has-workflow }}
      has-go: ${{ steps.check-labels.outputs.has-go }}
      has-deploy-scripts: ${{ steps.check-labels.outputs.has-deploy-scripts }}
    steps:
      - name: Get PR number
        id: get-pr
        run: echo "pr-number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Label PR based on changed files
        if: |
          github.event.action == 'opened' ||
          github.event.action == 'synchronize' ||
          github.event.action == 'reopened'
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Check labels
        id: check-labels
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr-number }}"

          # PRのラベルを取得
          LABELS=$(gh api /repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.labels[].name' | tr '\n' ',' || echo "")

          echo "PR Labels: $LABELS"

          # 部分文字列一致だと "frontend" が "frontend-foo" のような別ラベルにも
          # 誤爆する。カンマ区切りリストの前後をカンマで囲み ",label," の形で
          # 完全一致検索することで誤爆を防ぐ。
          has_label() {
            echo ",${LABELS}," | grep -q ",$1,"
          }

          # 各ラベルの存在をチェック
          if has_label "infrastructure"; then
            echo "has-infrastructure=true" >> $GITHUB_OUTPUT
          else
            echo "has-infrastructure=false" >> $GITHUB_OUTPUT
          fi

          if has_label "terraform"; then
            echo "has-terraform=true" >> $GITHUB_OUTPUT
          else
            echo "has-terraform=false" >> $GITHUB_OUTPUT
          fi

          if has_label "frontend"; then
            echo "has-frontend=true" >> $GITHUB_OUTPUT
          else
            echo "has-frontend=false" >> $GITHUB_OUTPUT
          fi

          if has_label "tests"; then
            echo "has-tests=true" >> $GITHUB_OUTPUT
          else
            echo "has-tests=false" >> $GITHUB_OUTPUT
          fi

          if has_label "workflow"; then
            echo "has-workflow=true" >> $GITHUB_OUTPUT
          else
            echo "has-workflow=false" >> $GITHUB_OUTPUT
          fi

          # Note: Rust label check removed - Rust implementation has been deleted (Task 21.2)

          if has_label "go"; then
            echo "has-go=true" >> $GITHUB_OUTPUT
          else
            echo "has-go=false" >> $GITHUB_OUTPUT
          fi

          if has_label "deploy-scripts"; then
            echo "has-deploy-scripts=true" >> $GITHUB_OUTPUT
          else
            echo "has-deploy-scripts=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =======================================
  # Job 1: Lint Check (always runs)
  # =======================================
  lint:
    needs: [setup-labels]
    name: ESLint & Prettier Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # No setup-node here: eslint/prettier run through `bun run`, which
      # doesn't need a separate Node.js install.
      - name: Setup Bun + Install Dependencies (root)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: .

      - name: Setup Bun + Install Dependencies (admin)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: frontend/admin

      - name: Run ESLint
        run: bun run lint

      - name: Run Prettier check
        run: bun run format:check

      - name: Lint frontend
        working-directory: frontend/admin
        run: bun run lint

  # =======================================
  # Job 1.5: Type Check (always runs, no label gate)
  # Without this, TypeScript / Astro type errors only surface in deploy.yml's
  # build-astro job — i.e. after terraform apply has already run.
  # =======================================
  typecheck:
    needs: [setup-labels]
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # No setup-node here: `bun run typecheck` shells out to `tsc`/`astro
      # check` via bun, which doesn't need a separate Node.js install.
      - name: Setup Bun + Install Dependencies (root)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: .

      - name: Setup Bun + Install Dependencies (admin)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: frontend/admin

      - name: Setup Bun + Install Dependencies (public-astro)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: frontend/public-astro

      # tsc --noEmit for admin/public, astro check for public-astro
      - name: Run type check
        run: bun run typecheck

  # =======================================
  # Job 2: Backend Unit Tests - REMOVED (Task 21.3)
  # Node.js implementation (functions/) has been deleted.
  # All Lambda functions are now implemented in Go.
  # See go-tests job for Go Lambda function tests.
  # =======================================

  # =======================================
  # Job 2.5a/b: Rust Lint and Tests - REMOVED (Task 21.2)
  # Rust implementation (rust-functions/) has been deleted.
  # All Lambda functions are now implemented in Go.
  # =======================================

  # =======================================
  # Job 2.6a: Go Lint (golangci-lint) - conditional on 'go' label
  # Requirement 6.1: go-lintジョブ - goラベル付きPRでgolangci-lint実行
  # Requirement 6.6: Go Lint失敗時のPRマージブロック
  # =======================================
  go-lint:
    needs: [setup-labels]
    name: Go Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.setup-labels.outputs.has-go == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go-functions/go.mod
          check-latest: false
          cache-dependency-path: go-functions/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: go-functions
          args: --timeout=5m

      - name: Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: go-functions
        continue-on-error: true

  # =======================================
  # Job 2.6b: Go Tests - Coverage (conditional on 'go' label)
  # Runs tests WITHOUT -race for fast coverage collection
  # Requirement 6.2: go-testsジョブ - go test -coverprofile実行
  # Requirement 6.3: 100%カバレッジ未満での失敗設定
  # =======================================
  go-tests-coverage:
    needs: [setup-labels]
    name: Go Tests (Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.setup-labels.outputs.has-go == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go-functions/go.mod
          check-latest: false
          cache-dependency-path: go-functions/go.sum

      - name: Run Go tests with coverage
        working-directory: go-functions
        run: |
          echo "========================================="
          echo "Go Environment Info"
          echo "========================================="
          go version
          go env GOVERSION
          echo ""
          echo "Running Go tests with coverage (no race detector)..."
          # Exclude benchmark package as it has no statements to cover
          # (benchmarks only contain test code, causing coverage profile issues in Go 1.25)
          # See: https://github.com/golang/go/issues/70244
          go list ./... | grep -v '/tests/benchmark$' | xargs go test -p 4 -coverprofile=coverage.out -covermode=atomic -v
          echo ""
          echo "Verifying coverage file..."
          if [ -f coverage.out ]; then
            echo "✓ coverage.out created successfully"
            ls -la coverage.out
          else
            echo "❌ coverage.out was not created"
            echo "Listing directory contents:"
            ls -la
            exit 1
          fi
        env:
          CI: true

      - name: Check coverage threshold (90% required)
        working-directory: go-functions
        run: |
          echo "========================================="
          echo "Go Coverage Report"
          echo "========================================="

          # Generate coverage report
          go tool cover -func=coverage.out

          # Extract total coverage percentage
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')

          echo ""
          echo "Total Coverage: ${COVERAGE}%"
          echo ""

          # Check if coverage is at least 90%
          # Using bc for floating point comparison
          if [ "$(echo "$COVERAGE < 90" | bc -l)" -eq 1 ]; then
            echo "❌ Coverage is below 90%: ${COVERAGE}%"
            echo "Go coverage threshold: 90% (main() functions excluded from practical coverage)"
            exit 1
          else
            echo "✓ Coverage meets 90% requirement: ${COVERAGE}%"
          fi

      - name: Upload Go coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: go-coverage
          path: go-functions/coverage.out
          retention-days: 3

  # =======================================
  # Job 2.6c: Go Tests - Race Detection (conditional on 'go' label)
  # Runs tests WITH -race but WITHOUT coverage for focused race detection
  # Requirement 6.2: go-testsジョブ - go test -race実行
  # Requirement 6.6: Go Tests失敗時のPRマージブロック
  # =======================================
  go-tests-race:
    needs: [setup-labels]
    name: Go Tests (Race Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NOTE: the base_ref == develop/main clause that used to live here was dead:
    # on.pull_request.branches already restricts this workflow to
    # [main, develop], so the clause was always true. Removed.
    if: needs.setup-labels.outputs.has-go == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go-functions/go.mod
          check-latest: false
          cache-dependency-path: go-functions/go.sum

      - name: Run Go tests with race detector
        working-directory: go-functions
        run: |
          echo "========================================="
          echo "Go Environment Info"
          echo "========================================="
          go version
          go env GOVERSION
          echo ""
          echo "Running Go tests with race detector (no coverage)..."
          # Exclude benchmark package (same as coverage job)
          # Use -p 2 (matching vCPU count) since -race increases memory usage 5-10x
          go list ./... | grep -v '/tests/benchmark$' | xargs go test -race -p 2 -v
        env:
          CI: true

  # =======================================
  # Job 2.6d: Go Tests Gate (conditional on 'go' label)
  # Aggregates go-tests-coverage and go-tests-race results
  # Keeps 'go-tests' name for downstream compatibility (coverage-check, ci-success)
  # Requirement 6.6: Go Tests失敗時のPRマージブロック
  # =======================================
  go-tests:
    needs: [setup-labels, go-tests-coverage, go-tests-race]
    name: Go Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      needs.setup-labels.outputs.has-go == 'true'

    steps:
      - name: Verify both jobs passed
        run: |
          echo "========================================="
          echo "Go Tests Gate"
          echo "========================================="
          echo ""
          echo "Coverage job: ${{ needs.go-tests-coverage.result }}"
          echo "Race detection job: ${{ needs.go-tests-race.result }}"
          echo ""
          if [ "${{ needs.go-tests-coverage.result }}" != "success" ]; then
            echo "❌ Go coverage tests did not pass (failure/cancelled/skipped)"
            exit 1
          fi
          # Race detection job may be skipped when not targeting develop/main branches
          if [ "${{ needs.go-tests-race.result }}" == "failure" ] || \
             [ "${{ needs.go-tests-race.result }}" == "cancelled" ]; then
            echo "❌ Go race detection tests failed or were cancelled"
            exit 1
          fi
          if [ "${{ needs.go-tests-race.result }}" == "skipped" ]; then
            echo "ℹ Race detection tests skipped (not targeting develop/main)"
          fi
          echo "✓ All Go tests passed"

  # =======================================
  # Terraform CI Jobs (conditional on 'terraform' label)
  # =======================================

  # =======================================
  # Job: Terraform Format Check
  # =======================================
  terraform-fmt:
    needs: [setup-labels]
    name: Terraform Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.setup-labels.outputs.has-terraform == 'true'
    outputs:
      fmt-outcome: ${{ steps.fmt.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: |
          echo "========================================="
          echo "Terraform Format Check"
          echo "========================================="
          cd terraform
          terraform fmt -check -recursive -diff
          echo "✓ All Terraform files are properly formatted"

  # =======================================
  # Job: Build Go Lambda Binaries (Parallel Matrix for Terraform)
  # =======================================
  terraform-build-lambdas:
    name: Build Lambda (${{ matrix.function }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [setup-labels]
    # Only terraform-plan-dev/prd consume these binaries, and both require
    # has-terraform == 'true'. go-functions/** carries the `go` + `infrastructure`
    # labels but NOT `terraform` (see .github/labeler.yml), so gating on
    # has-go too used to build all Lambdas in the matrix below (plus a merge job whose output
    # nothing reads) on every Go-only PR for no reason.
    if: needs.setup-labels.outputs.has-terraform == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - function: posts-create
            path: posts/create
          - function: posts-get
            path: posts/get
          - function: posts-get_public
            path: posts/get_public
          - function: posts-list
            path: posts/list
          - function: posts-update
            path: posts/update
          - function: posts-delete
            path: posts/delete
          - function: posts-build_status
            path: posts/build_status
          - function: posts-reconcile_build
            path: posts/reconcile_build
          - function: posts-get_by_slug
            path: posts/get_by_slug
          - function: auth-login
            path: auth/login
          - function: auth-logout
            path: auth/logout
          - function: auth-refresh
            path: auth/refresh
          - function: images-get_upload_url
            path: images/get_upload_url
          - function: images-delete
            path: images/delete
          - function: categories-list
            path: categories/list
          - function: categories-create
            path: categories/create
          - function: categories-update
            path: categories/update
          - function: categories-bulk_sort
            path: categories/bulk_sort
          - function: categories-delete
            path: categories/delete
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go-functions/go.mod
          check-latest: false
          cache-dependency-path: go-functions/go.sum

      - name: Cache Lambda binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: binary-cache
        with:
          path: go-functions/bin/${{ matrix.function }}
          key: lambda-${{ matrix.function }}-${{ runner.os }}-${{ hashFiles('go-functions/**/*.go', 'go-functions/go.sum') }}

      - name: Build Lambda binary (${{ matrix.function }})
        if: steps.binary-cache.outputs.cache-hit != 'true'
        working-directory: go-functions
        run: |
          echo "========================================="
          echo "Building Lambda: ${{ matrix.function }}"
          echo "========================================="
          mkdir -p bin/${{ matrix.function }}
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -tags="lambda.norpc" \
            -o bin/${{ matrix.function }}/bootstrap ./cmd/${{ matrix.path }}
          # Normalize timestamp for reproducible builds
          touch -t 202001010000.00 bin/${{ matrix.function }}/bootstrap
          echo "✓ ${{ matrix.function }} built successfully"

      - name: Cache hit status
        if: steps.binary-cache.outputs.cache-hit == 'true'
        run: echo "✓ ${{ matrix.function }} restored from cache"

      - name: Upload Lambda binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-${{ matrix.function }}
          path: go-functions/bin/${{ matrix.function }}/
          retention-days: 1

  # =======================================
  # Job: Merge Lambda Artifacts
  # =======================================
  terraform-merge-artifacts:
    name: Merge Lambda Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [terraform-build-lambdas]
    if: needs.terraform-build-lambdas.result == 'success'
    steps:
      - name: Checkout code (for hash calculation)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: go-functions
          sparse-checkout-cone-mode: false

      - name: Download all Lambda artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lambda-*
          path: go-functions/bin/
          merge-multiple: false

      - name: Reorganize artifacts
        run: |
          echo "========================================="
          echo "Merging Lambda Artifacts"
          echo "========================================="
          cd go-functions/bin
          for dir in lambda-*; do
            func_name="${dir#lambda-}"
            if [ -d "$dir" ]; then
              mkdir -p "$func_name"
              mv "$dir"/* "$func_name"/ 2>/dev/null || true
              rmdir "$dir" 2>/dev/null || true
            fi
          done
          echo "✓ Artifacts merged"
          ls -la

      - name: Verify all binaries present
        run: |
          echo "========================================="
          echo "Verifying Lambda Binaries"
          echo "========================================="
          FUNCS="posts-create posts-get posts-get_public posts-get_by_slug posts-list posts-update posts-delete posts-build_status posts-reconcile_build auth-login auth-logout auth-refresh images-get_upload_url images-delete categories-list categories-create categories-update categories-bulk_sort categories-delete"
          MISSING=0
          for f in $FUNCS; do
            if [ -f "go-functions/bin/$f/bootstrap" ]; then
              echo "✓ $f"
            else
              echo "✗ $f - MISSING"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "ERROR: $MISSING binaries missing!"
            exit 1
          fi
          echo "✓ All 19 binaries verified"

      - name: Save combined Lambda cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: go-functions/bin
          key: lambda-all-${{ runner.os }}-${{ hashFiles('go-functions/**/*.go', 'go-functions/go.sum') }}

      - name: Upload merged Lambda binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-binaries
          path: go-functions/bin/
          retention-days: 1

  # =======================================
  # Job: Terraform Validate (DEV)
  # =======================================
  terraform-validate-dev:
    name: Terraform Validate (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup-labels, terraform-fmt]
    if: |
      needs.setup-labels.outputs.has-terraform == 'true' &&
      needs.terraform-fmt.result == 'success' &&
      github.base_ref == 'develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Terraform (cached)
        uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init (backend disabled)
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          echo "✓ Terraform initialized"

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: |
          terraform validate
          echo "✓ Configuration is valid"

  # =======================================
  # Job: Terraform Validate (PRD)
  # =======================================
  terraform-validate-prd:
    name: Terraform Validate (PRD)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup-labels, terraform-fmt]
    if: |
      needs.setup-labels.outputs.has-terraform == 'true' &&
      needs.terraform-fmt.result == 'success' &&
      github.base_ref == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Terraform (cached)
        uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init (backend disabled)
        working-directory: terraform/environments/prd
        run: |
          terraform init -backend=false
          echo "✓ Terraform initialized"

      - name: Terraform Validate
        working-directory: terraform/environments/prd
        run: |
          terraform validate
          echo "✓ Configuration is valid"

  # =======================================
  # Job: Checkov Security Scan
  # =======================================
  terraform-security-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup-labels, terraform-fmt]
    if: |
      needs.setup-labels.outputs.has-terraform == 'true' &&
      needs.terraform-fmt.result == 'success'
    permissions:
      contents: read
      security-events: write # Required for upload-sarif to GitHub Code Scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Checkov Security Scan
        id: checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        with:
          directory: terraform
          config_file: terraform/.checkov.yaml
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
          download_external_modules: false
          log_level: WARNING

      - name: Checkov Summary
        if: always()
        run: |
          echo "========================================="
          echo "Checkov Security Scan Summary"
          echo "========================================="
          if [ "${{ steps.checkov.outcome }}" == "success" ]; then
            echo "✓ No security issues detected"
          else
            echo "⚠ Security issues detected - review logs above"
          fi

      - name: Upload Checkov SARIF to Code Scanning
        if: always() && hashFiles('results.sarif') != ''
        # Code Scanning API rate limit can fail this step when many Dependabot PRs
        # run concurrently. SARIF visibility is best-effort, so don't fail the job.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: checkov-terraform

  # =======================================
  # Job: Terraform Test - Determine Matrix Targets
  # `terraform test` only discovers *.tftest.hcl in the CURRENT module's
  # tests/ dir - it does NOT recurse into child modules. Running it with
  # `working-directory: terraform` therefore only ever exercised
  # terraform/tests/ (22 of 232 `run` blocks, 9.5%); the 191 blocks under
  # terraform/modules/*/tests/, 7 under bootstrap/tests/, and 12 under
  # terraform/environments/*/tests/ never ran, even though the preceding
  # `find . -name "*.tftest.hcl" | head -1` guard made the job look like it
  # found tests. scripts/ci/terraform-test-targets.sh enumerates every
  # terraform dir that actually has tests (optionally filtered to changed
  # dirs), and the matrix job below runs `terraform test` in each one.
  # =======================================
  terraform-test-matrix-prep:
    name: Terraform Test - Determine Targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup-labels, terraform-fmt]
    if: |
      needs.setup-labels.outputs.has-terraform == 'true' &&
      needs.terraform-fmt.result == 'success'
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has-targets: ${{ steps.targets.outputs.has-targets }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history is required so terraform-test-targets.sh can diff
          # against origin/${{ github.base_ref }} for the --changed filter.
          fetch-depth: 0

      - name: Determine terraform test targets
        id: targets
        run: |
          TARGETS=$(bash scripts/ci/terraform-test-targets.sh --changed "origin/${{ github.base_ref }}" --json)
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT
          echo "Targets: $TARGETS"
          if [ -z "$TARGETS" ] || [ "$TARGETS" = "[]" ]; then
            echo "has-targets=false" >> $GITHUB_OUTPUT
          else
            echo "has-targets=true" >> $GITHUB_OUTPUT
          fi

  # =======================================
  # Job: Terraform Test (Matrix)
  # One leg per terraform dir with tests (see terraform-test-matrix-prep
  # above). An empty matrix would error the workflow, so this job is
  # entirely gated on has-targets == 'true' instead of relying on an empty
  # `fromJSON([])` matrix.
  # =======================================
  terraform-test:
    name: Terraform Test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup-labels, terraform-test-matrix-prep]
    if: needs.terraform-test-matrix-prep.outputs.has-targets == 'true'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.terraform-test-matrix-prep.outputs.targets) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Terraform (cached)
        uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}

      - name: Run Terraform Tests
        working-directory: ${{ matrix.dir }}
        run: |
          echo "========================================="
          echo "Terraform Module Tests: ${{ matrix.dir }}"
          echo "========================================="
          terraform init -backend=false
          terraform test
          echo "✓ Module tests passed for ${{ matrix.dir }}"

  # =======================================
  # Job: Terraform Plan (DEV)
  # =======================================
  terraform-plan-dev:
    name: Terraform Plan (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup-labels, terraform-validate-dev, terraform-merge-artifacts]
    environment: dev
    # NOTE: Duplicate CI runs for the *same* PR (from the `labeled`/`unlabeled`
    # event storm) are de-duplicated by the workflow-level `concurrency` group
    # keyed on the PR number (see top of file). Plans for *different* PRs still
    # run in parallel and wait politely for the shared DynamoDB state lock via
    # `terraform plan -lock-timeout` (see the Plan step). We intentionally do NOT
    # use a fixed shared group, which would cancel cross-PR plans as false
    # "cancelled" failures.
    if: |
      always() &&
      needs.setup-labels.outputs.has-terraform == 'true' &&
      needs.terraform-validate-dev.result == 'success' &&
      needs.terraform-merge-artifacts.result == 'success' &&
      github.base_ref == 'develop'
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download Lambda binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-binaries
          path: go-functions/bin

      - name: Setup Terraform (cached)
        uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terraform-wrapper: 'false'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformPlan-DEV

      - name: Get Basic Auth Credentials from SSM
        run: |
          USERNAME=$(aws ssm get-parameter --name "/serverless-blog/dev/basic-auth/username" --with-decryption --query "Parameter.Value" --output text)
          PASSWORD=$(aws ssm get-parameter --name "/serverless-blog/dev/basic-auth/password" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          echo "TF_VAR_basic_auth_username=$USERNAME" >> $GITHUB_ENV
          echo "TF_VAR_basic_auth_password=$PASSWORD" >> $GITHUB_ENV
          echo "✓ Basic Auth credentials loaded from SSM"

      - name: Get Cloudflare API Token from SSM
        run: |
          CLOUDFLARE_TOKEN=$(aws ssm get-parameter --name "/serverless-blog/dev/cloudflare/apikey" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::$CLOUDFLARE_TOKEN"
          echo "TF_VAR_cloudflare_api_token=$CLOUDFLARE_TOKEN" >> $GITHUB_ENV
          echo "TF_VAR_enable_custom_domain=true" >> $GITHUB_ENV
          echo "✓ Cloudflare API token loaded from SSM"

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -backend-config="bucket=terraform-state-${ACCOUNT_ID}"

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/dev
        run: |
          # -lock-timeout lets concurrent PR plans wait for the shared DynamoDB
          # state lock instead of failing immediately with "Error acquiring the state lock".
          terraform plan -out=tfplan.binary -lock-timeout=5m -detailed-exitcode -no-color 2>&1 | tee tfplan_output.txt || exitcode=$?
          terraform show -json tfplan.binary > tfplan.json
          terraform show -no-color tfplan.binary > tfplan.txt
          echo "exitcode=${exitcode:-0}" >> $GITHUB_OUTPUT

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-dev
          path: |
            terraform/environments/dev/tfplan.binary
            terraform/environments/dev/tfplan.json
            terraform/environments/dev/tfplan.txt
          retention-days: 3

      - name: Comment Plan on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const planPath = 'terraform/environments/dev/tfplan.txt';
            let plan = fs.existsSync(planPath) ? fs.readFileSync(planPath, 'utf8') : 'Plan not available';
            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n\n... (truncated)';
            }
            const summaryMatch = plan.match(/Plan: (\d+) to add, (\d+) to change, (\d+) to destroy/);
            const summary = summaryMatch
              ? `**${summaryMatch[1]}** to add, **${summaryMatch[2]}** to change, **${summaryMatch[3]}** to destroy`
              : plan.includes('No changes') ? '✅ No changes' : 'Summary not available';

            const output = `## 📋 Terraform Plan (DEV)\n\n### Summary\n${summary}\n\n<details>\n<summary>Show Plan Details</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # =======================================
  # Job: Terraform Plan (PRD)
  # =======================================
  terraform-plan-prd:
    name: Terraform Plan (PRD)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup-labels, terraform-validate-prd, terraform-merge-artifacts]
    environment: prod
    # NOTE: Duplicate CI runs for the *same* PR (from the `labeled`/`unlabeled`
    # event storm) are de-duplicated by the workflow-level `concurrency` group
    # keyed on the PR number (see top of file). Plans for *different* PRs still
    # run in parallel and wait politely for the shared DynamoDB state lock via
    # `terraform plan -lock-timeout` (see the Plan step). We intentionally do NOT
    # use a fixed shared group, which would cancel cross-PR plans as false
    # "cancelled" failures.
    if: |
      always() &&
      needs.setup-labels.outputs.has-terraform == 'true' &&
      needs.terraform-validate-prd.result == 'success' &&
      needs.terraform-merge-artifacts.result == 'success' &&
      github.base_ref == 'main'
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download Lambda binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-binaries
          path: go-functions/bin

      - name: Setup Terraform (cached)
        uses: ./.github/actions/setup-terraform-cached
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          terraform-wrapper: 'false'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformPlan-PRD

      - name: Get PRD credentials from SSM
        run: |
          ALARM_EMAIL=$(aws ssm get-parameter --name "/serverless-blog/prd/monitoring/alarm-email" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::$ALARM_EMAIL"
          echo "TF_VAR_alarm_email=$ALARM_EMAIL" >> $GITHUB_ENV
          CLOUDFLARE_TOKEN=$(aws ssm get-parameter --name "/serverless-blog/prd/cloudflare/apikey" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::$CLOUDFLARE_TOKEN"
          echo "TF_VAR_cloudflare_api_token=$CLOUDFLARE_TOKEN" >> $GITHUB_ENV
          echo "TF_VAR_enable_custom_domain=true" >> $GITHUB_ENV
          echo "✓ PRD credentials loaded from SSM"

      - name: Terraform Init
        working-directory: terraform/environments/prd
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -backend-config="bucket=terraform-state-${ACCOUNT_ID}"

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/prd
        run: |
          # -lock-timeout lets concurrent PR plans wait for the shared DynamoDB
          # state lock instead of failing immediately with "Error acquiring the state lock".
          terraform plan -out=tfplan.binary -lock-timeout=5m -detailed-exitcode -no-color 2>&1 | tee tfplan_output.txt || exitcode=$?
          terraform show -json tfplan.binary > tfplan.json
          terraform show -no-color tfplan.binary > tfplan.txt
          echo "exitcode=${exitcode:-0}" >> $GITHUB_OUTPUT

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-prd
          path: |
            terraform/environments/prd/tfplan.binary
            terraform/environments/prd/tfplan.json
            terraform/environments/prd/tfplan.txt
          retention-days: 3

      - name: Comment Plan on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const planPath = 'terraform/environments/prd/tfplan.txt';
            let plan = fs.existsSync(planPath) ? fs.readFileSync(planPath, 'utf8') : 'Plan not available';
            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n\n... (truncated)';
            }
            const summaryMatch = plan.match(/Plan: (\d+) to add, (\d+) to change, (\d+) to destroy/);
            const summary = summaryMatch
              ? `**${summaryMatch[1]}** to add, **${summaryMatch[2]}** to change, **${summaryMatch[3]}** to destroy`
              : plan.includes('No changes') ? '✅ No changes' : 'Summary not available';

            const output = `## 🚨 Terraform Plan (PRD) - PRODUCTION\n\n### Summary\n${summary}\n\n> ⚠️ **This plan affects PRODUCTION infrastructure!**\n\n<details>\n<summary>Show Plan Details</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # =======================================
  # CDK Infrastructure Jobs - REMOVED
  # CDK to Terraform migration completed. All infrastructure is now managed by Terraform.
  # Former jobs: infrastructure-tests, infrastructure-diff
  # =======================================

  # =======================================
  # Job 3: Frontend Tests - Public (REMOVED)
  # The legacy React SPA (frontend/public) was deleted; the public site is
  # Astro SSG and is covered by frontend-astro-tests below.
  # =======================================

  # =======================================
  # Job 4: Frontend Tests - Public Astro SSG (conditional)
  # This is the site actually served in production. Its unit tests and the
  # build-output integration suite previously ran nowhere in CI.
  # =======================================
  frontend-astro-tests:
    needs: [setup-labels]
    name: Frontend Tests (Public Site - Astro)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.setup-labels.outputs.has-frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # No setup-node here: this job only runs bun/vitest and a bash build
      # script, nothing calls `node -e` directly.
      - name: Setup Bun + Install Dependencies (public-astro)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: frontend/public-astro

      - name: Run frontend (public-astro) unit tests
        working-directory: frontend/public-astro
        run: bun run test -- --run
        env:
          CI: true

      # vitest.config.ts excludes tests/**, so the build-output, sitemap, rss
      # and seo-integration suites need a real build against a mock API first.
      - name: Build against mock API
        working-directory: frontend/public-astro
        run: bash tests/build-with-mock.sh
        env:
          CI: true

      # e2e-public-tests needs this exact same build (astro preview serves
      # dist/), so publish it here instead of letting that job rebuild it
      # from scratch (Astro builds were happening twice per PR).
      - name: Upload Astro build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-astro-dist
          path: frontend/public-astro/dist/
          retention-days: 2

      - name: Run frontend (public-astro) integration tests
        working-directory: frontend/public-astro
        run: bun run test:integration -- --run
        env:
          CI: true

  # =======================================
  # Job 5: Frontend Tests - Admin (conditional)
  # =======================================
  frontend-admin-tests:
    needs: [setup-labels]
    name: Frontend Tests (Admin)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.setup-labels.outputs.has-frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # No setup-node here: this job only runs `bun run test:coverage`.
      - name: Setup Bun + Install Dependencies (root)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: .

      - name: Setup Bun + Install Dependencies (admin)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: frontend/admin

      - name: Run frontend (admin) tests with coverage
        working-directory: frontend/admin
        run: bun run test:coverage
        env:
          CI: true

      - name: Upload frontend (admin) coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-admin-coverage
          path: frontend/admin/coverage/
          retention-days: 3

  # =======================================
  # Job 6: E2E Tests - Public Site (always runs if frontend tests passed)
  # The public site is Astro SSG, so the browser tests run against a real
  # build served by `astro preview` rather than a dev server with in-browser
  # mocks: the post data is baked in at build time.
  # =======================================
  e2e-public-tests:
    name: E2E Tests (Public Site)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-astro-tests]
    if: |
      !cancelled() &&
      (needs.frontend-astro-tests.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup Bun + Install Dependencies (root)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: .

      - name: Setup Bun + Install Dependencies (public-astro)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: frontend/public-astro

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          # Disable Microsoft package repositories that may cause 403 errors
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list || true
          bunx playwright install-deps chromium

      # astro preview (started by playwright.config.ts) serves dist/. Reuse
      # the exact build frontend-astro-tests already produced against the
      # mock API instead of rebuilding it here (Astro was building twice
      # per PR).
      - name: Download Astro build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-astro-dist
          path: frontend/public-astro/dist

      - name: Run E2E tests (Public Site) - Chromium only
        run: bun run test:e2e -- --project=chromium
        env:
          CI: true

      - name: Upload Playwright Report (Public)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-public
          path: playwright-report/
          retention-days: 3

  # =======================================
  # Job 7: E2E Tests - Admin Site (always runs if frontend tests passed)
  # =======================================
  e2e-admin-tests:
    name: E2E Tests (Admin - Auth, CRUD, Categories & Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-admin-tests]
    if: |
      !cancelled() &&
      (needs.frontend-admin-tests.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup Bun + Install Dependencies (root)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: .

      - name: Setup Bun + Install Dependencies (admin)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: frontend/admin

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          # Disable Microsoft package repositories that may cause 403 errors
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list || true
          bunx playwright install-deps chromium

      - name: Run E2E tests (Admin - Auth, CRUD, Categories & Security) - Chromium only
        # PR 時にゲートする admin spec は 6 件（auth / crud / categories /
        # unauthorized-access / slug-conflict / metadata-sidebar）。
        # 残りの admin-*.spec.ts (tiptap / image-* / autosave / unsaved-guard /
        # publish-flow / preview-parity) は MSW 環境（Tiptap エディタ初期化の
        # レース）で flakiness があり、コミット deee4d8 の対応どおり PR CI
        # からは除外している。全 16 spec は post-deploy AWS E2E ジョブ
        # (deploy.yml) の nightly 実行でカバーする。安定化したら順次 PR CI に
        # 追加する。
        # --workers=1 は playwright.admin.config.ts の workers 設定
        # (CI 時は 4) を上書きしてしまうため削除した。
        run: bun run test:e2e:admin -- tests/e2e/specs/admin-auth.spec.ts tests/e2e/specs/admin-crud.spec.ts tests/e2e/specs/admin-categories.spec.ts tests/e2e/specs/admin-unauthorized-access.spec.ts tests/e2e/specs/admin-slug-conflict.spec.ts tests/e2e/specs/admin-metadata-sidebar.spec.ts --project=chromium
        env:
          CI: true

      - name: Upload Playwright Report (Admin)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-admin
          path: playwright-report-admin/
          retention-days: 3

  # =======================================
  # Job: Deploy Scripts Tests (conditional on 'deploy-scripts' label)
  # scripts/deploy/*.test.ts (59 tests covering the atomic CloudFront KVS
  # release-pointer deploy) previously ran nowhere - not in CI, not in
  # `bun run verify`, not in the husky pre-commit hook.
  # =======================================
  deploy-scripts-tests:
    needs: [setup-labels]
    name: Deploy Scripts Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.setup-labels.outputs.has-deploy-scripts == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Bun + Install Dependencies (scripts/deploy)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: scripts/deploy

      - name: Run deploy scripts tests
        working-directory: scripts/deploy
        run: bun run test -- --run
        env:
          CI: true

  # =======================================
  # Job 7: Coverage Badges (runs when any test ran)
  # Note: backend-unit-tests removed (Task 21.3) - Node.js Lambda deleted
  # Note: infrastructure-tests removed - CDK to Terraform migration completed
  # Note: this job only downloads coverage artifacts and generates badges.
  # Coverage is actually ENFORCED by go-tests-coverage (90% threshold, see
  # "Check coverage threshold" step above) and frontend/admin's vitest
  # coverageThreshold (80%, frontend/admin/vitest.config.ts) - not by
  # anything in this job.
  # =======================================
  coverage-check:
    name: Coverage Badges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - go-tests
      - frontend-admin-tests
    if: |
      !cancelled() &&
      (needs.go-tests.result == 'success' ||
       needs.frontend-admin-tests.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download Go coverage
        if: needs.go-tests.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-coverage
          path: coverage-go/

      - name: Download frontend (admin) coverage
        if: needs.frontend-admin-tests.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-admin-coverage
          path: coverage-frontend-admin/

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup Bun + Install Dependencies (root)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: .

      - name: Reorganize coverage files
        run: |
          mkdir -p go-functions frontend/admin/coverage
          cp -r coverage-go/* go-functions/ || true
          cp -r coverage-frontend-admin/* frontend/admin/coverage/ || true

      - name: Generate coverage badges
        run: bun run coverage:badges

      - name: Upload coverage badges
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badges
          path: docs/badges/
          retention-days: 3

  # =======================================
  # Job: Final CI Success Check
  # =======================================
  ci-success:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - setup-labels
      - lint
      - typecheck
      # Go Backend
      - go-lint
      - go-tests
      # Terraform Infrastructure
      - terraform-fmt
      - terraform-build-lambdas
      - terraform-merge-artifacts
      - terraform-validate-dev
      - terraform-validate-prd
      - terraform-security-scan
      - terraform-test-matrix-prep
      - terraform-test
      - terraform-plan-dev
      - terraform-plan-prd
      # Frontend
      - frontend-astro-tests
      - frontend-admin-tests
      - e2e-public-tests
      - e2e-admin-tests
      - coverage-check
      # Deploy scripts
      - deploy-scripts-tests
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "========================================="
          echo "CI Results Summary"
          echo "========================================="
          echo ""
          echo "Labels detected:"
          echo "  terraform: ${{ needs.setup-labels.outputs.has-terraform }}"
          echo "  go: ${{ needs.setup-labels.outputs.has-go }}"
          echo "  frontend: ${{ needs.setup-labels.outputs.has-frontend }}"
          echo "  infrastructure: ${{ needs.setup-labels.outputs.has-infrastructure }}"
          echo "  deploy-scripts: ${{ needs.setup-labels.outputs.has-deploy-scripts }}"
          echo ""
          echo "--- Lint ---"
          echo "  ESLint & Prettier: ${{ needs.lint.result }}"
          echo "  Type Check: ${{ needs.typecheck.result }}"
          echo ""
          echo "--- Go Backend ---"
          echo "  Go Lint: ${{ needs.go-lint.result }}"
          echo "  Go Tests: ${{ needs.go-tests.result }}"
          echo ""
          echo "--- Terraform Infrastructure ---"
          echo "  Format: ${{ needs.terraform-fmt.result }}"
          echo "  Build Lambdas: ${{ needs.terraform-build-lambdas.result }}"
          echo "  Merge Artifacts: ${{ needs.terraform-merge-artifacts.result }}"
          echo "  Validate (DEV): ${{ needs.terraform-validate-dev.result }}"
          echo "  Validate (PRD): ${{ needs.terraform-validate-prd.result }}"
          echo "  Security Scan: ${{ needs.terraform-security-scan.result }}"
          echo "  Test - Determine Targets: ${{ needs.terraform-test-matrix-prep.result }}"
          echo "  Test: ${{ needs.terraform-test.result }}"
          echo "  Plan (DEV): ${{ needs.terraform-plan-dev.result }}"
          echo "  Plan (PRD): ${{ needs.terraform-plan-prd.result }}"
          echo ""
          echo "--- Frontend ---"
          echo "  Public Astro Tests: ${{ needs.frontend-astro-tests.result }}"
          echo "  Admin Tests: ${{ needs.frontend-admin-tests.result }}"
          echo "  E2E Public: ${{ needs.e2e-public-tests.result }}"
          echo "  E2E Admin: ${{ needs.e2e-admin-tests.result }}"
          echo "  Coverage Badges: ${{ needs.coverage-check.result }}"
          echo ""
          echo "--- Deploy Scripts ---"
          echo "  Deploy Scripts Tests: ${{ needs.deploy-scripts-tests.result }}"
          echo ""
          echo "========================================="

      - name: Verify required checks
        run: |
          # Every dependency must resolve to "success" (ran and passed) or
          # "skipped" (its `if:` gate correctly excluded it - e.g. no
          # matching label, or no terraform test targets changed on this
          # PR). Anything else - "failure", "cancelled", or an unexpected
          # empty value - fails the gate.
          #
          # Previously this only checked for the literal string "failure",
          # so a *cancelled* job passed silently. Worse, if
          # terraform-merge-artifacts failed, both terraform-plan-dev and
          # terraform-plan-prd become "skipped" (their `if:` requires the
          # merge job to succeed) - skipped != failure, so CI reported
          # green even though the merge step was broken. Checking
          # terraform-merge-artifacts and terraform-security-scan directly
          # here closes that hole.
          FAILED=false

          check_required() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "❌ $name: $result"
              FAILED=true
            else
              echo "✓ $name: $result"
            fi
          }

          check_required "Lint" "${{ needs.lint.result }}"
          check_required "Type Check" "${{ needs.typecheck.result }}"
          check_required "Go Lint" "${{ needs.go-lint.result }}"
          check_required "Go Tests" "${{ needs.go-tests.result }}"
          check_required "Terraform Format" "${{ needs.terraform-fmt.result }}"
          check_required "Terraform Build Lambdas" "${{ needs.terraform-build-lambdas.result }}"
          check_required "Terraform Merge Artifacts" "${{ needs.terraform-merge-artifacts.result }}"
          check_required "Terraform Validate (DEV)" "${{ needs.terraform-validate-dev.result }}"
          check_required "Terraform Validate (PRD)" "${{ needs.terraform-validate-prd.result }}"
          check_required "Terraform Security Scan" "${{ needs.terraform-security-scan.result }}"
          check_required "Terraform Test - Determine Targets" "${{ needs.terraform-test-matrix-prep.result }}"
          check_required "Terraform Test" "${{ needs.terraform-test.result }}"
          check_required "Terraform Plan (DEV)" "${{ needs.terraform-plan-dev.result }}"
          check_required "Terraform Plan (PRD)" "${{ needs.terraform-plan-prd.result }}"
          check_required "Frontend Astro Tests" "${{ needs.frontend-astro-tests.result }}"
          check_required "Frontend Admin Tests" "${{ needs.frontend-admin-tests.result }}"
          check_required "E2E Public" "${{ needs.e2e-public-tests.result }}"
          check_required "E2E Admin" "${{ needs.e2e-admin-tests.result }}"
          check_required "Coverage Badges" "${{ needs.coverage-check.result }}"
          check_required "Deploy Scripts Tests" "${{ needs.deploy-scripts-tests.result }}"

          if [ "$FAILED" = true ]; then
            echo ""
            echo "❌ One or more CI checks failed"
            exit 1
          fi

          echo "========================================="
          echo "✓ All CI Checks Passed Successfully!"
          echo "========================================="
