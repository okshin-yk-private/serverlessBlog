name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: [CI, Security Scan, Dependency Update Security]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate (always read-only)'
        required: true
        type: string

# Missing/unknown mode is dry-run. No PR code/artifacts/cache is executed here.
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted controller only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/develop
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Create narrowly scoped merge token only after activation
        id: app
        if: vars.DEPENDABOT_AUTOMERGE_MODE == 'enabled' && github.event_name == 'workflow_run'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDABOT_AUTOMERGE_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTOMERGE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-administration: read
      - name: Re-evaluate current PR and merge only its verified SHA
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          AUTOMERGE_MODE: ${{ vars.DEPENDABOT_AUTOMERGE_MODE }}
        run: python3 scripts/ci/dependabot_automerge.py
