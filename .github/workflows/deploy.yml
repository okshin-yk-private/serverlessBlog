# Unified Deploy Workflow
# Handles deployment for all components:
# - Infrastructure (Terraform)
# - Backend (Go Lambda via Terraform)
# - Frontend (S3 static sites)
# - Frontend Astro SSG (S3 atomic deployment)
#
# Triggers:
# - develop branch push: Deploy to DEV environment
# - main branch push: Deploy to PRD environment (with approval)
# - workflow_dispatch: Manual deployment

name: Deploy

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'terraform/**'
      - 'go-functions/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
      - 'tests/e2e/**'
      - 'tests/config/**'
      - 'playwright.aws.config.ts'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prd
      components:
        description: 'Components to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - infrastructure
          - frontend
          - astro

# develop/main への連続 push で terraform apply が同じ S3/DynamoDB state に対して
# 同時に走ると、後発の apply は -lock-timeout を渡していないため state lock 待ちで
# 即座に失敗する。plan と違い apply の取り消しはデータ不整合のリスクの方が大きい
# ため、実行中の apply を cancel-in-progress で打ち切らず、キューイングして順番に
# 適用させる。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TERRAFORM_VERSION: '1.14.0'
  GO_VERSION: '1.25.12'
  # BUN_VERSION は削除済み: どのジョブからも参照されておらず、
  # ./.github/actions/setup-bun-deps 側のデフォルト値 (1.2.0) がそのまま使われる。
  AWS_REGION: 'ap-northeast-1'

jobs:
  # =======================================
  # Determine what to deploy
  # =======================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy-infrastructure: ${{ steps.changes.outputs.infrastructure }}
      deploy-frontend: ${{ steps.changes.outputs.frontend }}
      deploy-astro: ${{ steps.changes.outputs.astro }}
      target-env: ${{ steps.env.outputs.target-env }}
      github-env: ${{ steps.env.outputs.github-env }}
    steps:
      - name: Checkout code
        # Pin to specific commit SHA for security (Requirement 9.8)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual dispatch - check components input
            if [ "${{ github.event.inputs.components }}" == "all" ]; then
              echo "infrastructure=true" >> $GITHUB_OUTPUT
              echo "frontend=true" >> $GITHUB_OUTPUT
              echo "astro=true" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.inputs.components }}" == "infrastructure" ]; then
              echo "infrastructure=true" >> $GITHUB_OUTPUT
              echo "frontend=false" >> $GITHUB_OUTPUT
              echo "astro=false" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.inputs.components }}" == "astro" ]; then
              echo "infrastructure=false" >> $GITHUB_OUTPUT
              echo "frontend=false" >> $GITHUB_OUTPUT
              echo "astro=true" >> $GITHUB_OUTPUT
            else
              echo "infrastructure=false" >> $GITHUB_OUTPUT
              echo "frontend=true" >> $GITHUB_OUTPUT
              echo "astro=false" >> $GITHUB_OUTPUT
            fi
          else
            # Push event - detect from changed files
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

            if echo "$CHANGED" | grep -qE "^(terraform/|go-functions/)"; then
              echo "infrastructure=true" >> $GITHUB_OUTPUT
            else
              echo "infrastructure=false" >> $GITHUB_OUTPUT
            fi

            # Admin frontend only - public site is now handled by Astro SSG
            if echo "$CHANGED" | grep -qE "^frontend/admin/"; then
              echo "frontend=true" >> $GITHUB_OUTPUT
            else
              echo "frontend=false" >> $GITHUB_OUTPUT
            fi

            if echo "$CHANGED" | grep -qE "^frontend/public-astro/"; then
              echo "astro=true" >> $GITHUB_OUTPUT
            else
              echo "astro=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Determine target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TARGET_ENV="prd"
          else
            TARGET_ENV="dev"
          fi
          echo "target-env=${TARGET_ENV}" >> $GITHUB_OUTPUT
          # GitHub Environment name mapping (prd -> prod for approval gates)
          if [ "$TARGET_ENV" == "prd" ]; then
            echo "github-env=prod" >> $GITHUB_OUTPUT
          else
            echo "github-env=${TARGET_ENV}" >> $GITHUB_OUTPUT
          fi

  # =======================================
  # Restore Lambda Binaries from Cache
  # =======================================
  restore-lambda-binaries:
    name: Restore Lambda Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes]
    if: needs.detect-changes.outputs.deploy-infrastructure == 'true'
    outputs:
      cache-hit: ${{ steps.verify.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: go-functions
          sparse-checkout-cone-mode: false

      - name: Restore Lambda cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        with:
          path: go-functions/bin
          key: lambda-all-${{ runner.os }}-${{ hashFiles('go-functions/**/*.go', 'go-functions/go.sum') }}
          restore-keys: |
            lambda-all-${{ runner.os }}-

      - name: Verify binaries
        id: verify
        run: |
          echo "========================================="
          echo "Checking Lambda Binaries from Cache"
          echo "========================================="
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss - will build binaries"
            echo "cache-hit=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          FUNCS="posts-create posts-get posts-get_public posts-get_by_slug posts-list posts-update posts-delete posts-build_status posts-reconcile_build auth-login auth-logout auth-refresh images-get_upload_url images-delete categories-list categories-create categories-update categories-bulk_sort categories-delete"
          TOTAL=0
          for f in $FUNCS; do TOTAL=$((TOTAL + 1)); done
          COUNT=0
          for f in $FUNCS; do
            if [ -f "go-functions/bin/$f/bootstrap" ]; then
              echo "✓ $f"
              COUNT=$((COUNT + 1))
            else
              echo "✗ $f - MISSING"
            fi
          done
          if [ $COUNT -eq $TOTAL ]; then
            echo "✓ All $TOTAL binaries restored from cache"
            echo "cache-hit=true" >> $GITHUB_OUTPUT
          else
            echo "Only $COUNT of $TOTAL binaries found - will rebuild"
            echo "cache-hit=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload cached binaries as artifact
        if: steps.verify.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-binaries
          path: go-functions/bin/
          retention-days: 1

  # =======================================
  # Build Go Lambda Binaries (Parallel Matrix) - Only on cache miss
  # =======================================
  build-lambdas:
    name: Build Lambda (${{ matrix.function }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, restore-lambda-binaries]
    if: |
      needs.detect-changes.outputs.deploy-infrastructure == 'true' &&
      needs.restore-lambda-binaries.outputs.cache-hit != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - function: posts-create
            path: posts/create
          - function: posts-get
            path: posts/get
          - function: posts-get_public
            path: posts/get_public
          - function: posts-list
            path: posts/list
          - function: posts-update
            path: posts/update
          - function: posts-delete
            path: posts/delete
          - function: posts-build_status
            path: posts/build_status
          - function: posts-reconcile_build
            path: posts/reconcile_build
          - function: posts-get_by_slug
            path: posts/get_by_slug
          - function: auth-login
            path: auth/login
          - function: auth-logout
            path: auth/logout
          - function: auth-refresh
            path: auth/refresh
          - function: images-get_upload_url
            path: images/get_upload_url
          - function: images-delete
            path: images/delete
          - function: categories-list
            path: categories/list
          - function: categories-create
            path: categories/create
          - function: categories-update
            path: categories/update
          - function: categories-bulk_sort
            path: categories/bulk_sort
          - function: categories-delete
            path: categories/delete
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go-functions/go.sum

      - name: Build Lambda binary
        working-directory: go-functions
        run: |
          mkdir -p bin/${{ matrix.function }}
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -tags="lambda.norpc" \
            -o bin/${{ matrix.function }}/bootstrap ./cmd/${{ matrix.path }}
          # Normalize timestamp for reproducible builds
          touch -t 202001010000.00 bin/${{ matrix.function }}/bootstrap
          echo "✓ ${{ matrix.function }} built"

      - name: Upload Lambda binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-${{ matrix.function }}
          path: go-functions/bin/${{ matrix.function }}/
          retention-days: 1

  # =======================================
  # Merge Lambda Artifacts (only when built, not from cache)
  # =======================================
  merge-lambda-artifacts:
    name: Merge Lambda Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [restore-lambda-binaries, build-lambdas]
    if: |
      always() &&
      needs.restore-lambda-binaries.outputs.cache-hit != 'true' &&
      needs.build-lambdas.result == 'success'
    steps:
      - name: Checkout code
        # hashFiles('go-functions/**/*.go', 'go-functions/go.sum') を使う
        # cache save (下記) の key を計算するには対象ファイルが実在している
        # 必要がある。checkout が無いと hashFiles は空文字を返し、key が
        # 定数に潰れてキャッシュが機能しなくなる。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: go-functions
          sparse-checkout-cone-mode: false

      - name: Download all Lambda artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lambda-*
          path: go-functions/bin/
          merge-multiple: false

      - name: Reorganize artifacts
        run: |
          cd go-functions/bin
          for dir in lambda-*; do
            func_name="${dir#lambda-}"
            if [ -d "$dir" ]; then
              mkdir -p "$func_name"
              mv "$dir"/* "$func_name"/ 2>/dev/null || true
              rmdir "$dir" 2>/dev/null || true
            fi
          done
          echo "✓ Artifacts merged"

      - name: Upload merged Lambda binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-binaries
          path: go-functions/bin/
          retention-days: 1

      - name: Save Lambda binaries to cache
        # restore-lambda-binaries が読む key (lambda-all-${{ runner.os }}-<hash>) の
        # 唯一の書き手は ci.yml の terraform-merge-artifacts だが、そちらは
        # pull_request でのみ実行される。GitHub Actions のキャッシュは PR の ref に
        # スコープされるため、develop/main への push ではそのキャッシュを読めず、
        # base ブランチ側で書く側も存在しない。結果として deploy 実行のたびに 18個
        # 全バイナリが再ビルドされていた。ここで deploy.yml 自身が同じ key で保存
        # することで、次回以降の push (同一 go source hash の間) がキャッシュを
        # ヒットできるようにする。
        #
        # continue-on-error: ほぼ同時刻に同一 source hash で push が複数走った場合、
        # 先着の実行がこの key で保存済みだと後着の save は「Cache already exists」で
        # 失敗する。実害はない (次回以降はそのキャッシュを読めばよい) ため job は
        # 失敗させない。
        id: cache-save
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: go-functions/bin
          key: lambda-all-${{ runner.os }}-${{ hashFiles('go-functions/**/*.go', 'go-functions/go.sum') }}

  # =======================================
  # Deploy Infrastructure (DEV)
  # =======================================
  deploy-infrastructure-dev:
    name: Deploy Infrastructure (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-changes, restore-lambda-binaries, merge-lambda-artifacts]
    environment: dev
    if: |
      always() &&
      needs.detect-changes.outputs.deploy-infrastructure == 'true' &&
      needs.detect-changes.outputs.target-env == 'dev' &&
      (needs.restore-lambda-binaries.outputs.cache-hit == 'true' || needs.merge-lambda-artifacts.result == 'success')
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download Lambda binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-binaries
          path: go-functions/bin

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformApply-DEV

      - name: Create Terraform plugin cache dir
        run: mkdir -p ${{ github.workspace }}/.terraform.d/plugin-cache

      - name: Cache Terraform providers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Get Basic Auth Credentials from SSM
        run: |
          # Use --with-decryption for both (safe for non-SecureString too)
          USERNAME=$(aws ssm get-parameter --name "/serverless-blog/dev/basic-auth/username" --with-decryption --query "Parameter.Value" --output text)
          PASSWORD=$(aws ssm get-parameter --name "/serverless-blog/dev/basic-auth/password" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          echo "TF_VAR_basic_auth_username=$USERNAME" >> $GITHUB_ENV
          echo "TF_VAR_basic_auth_password=$PASSWORD" >> $GITHUB_ENV
          echo "✓ Basic Auth credentials loaded from SSM"

      - name: Get Cloudflare API Token from SSM
        run: |
          CLOUDFLARE_TOKEN=$(aws ssm get-parameter --name "/serverless-blog/dev/cloudflare/apikey" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::$CLOUDFLARE_TOKEN"
          echo "TF_VAR_cloudflare_api_token=$CLOUDFLARE_TOKEN" >> $GITHUB_ENV
          echo "TF_VAR_enable_custom_domain=true" >> $GITHUB_ENV
          echo "✓ Cloudflare API token loaded from SSM"

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -backend-config="bucket=terraform-state-${ACCOUNT_ID}"

      # Plan is run on PR by ci.yml's terraform-plan-dev job. We skip the
      # explicit plan step here to avoid duplication. `terraform apply
      # -auto-approve` will internally re-plan against current state and
      # apply atomically; the plan summary still appears in the apply log.
      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: |
          echo "========================================="
          echo "Deploying to DEV Environment"
          echo "========================================="
          terraform apply -auto-approve
          echo "✓ DEV deployment complete"

      - name: Get Outputs
        id: outputs
        working-directory: terraform/environments/dev
        run: |
          echo "cloudfront_domain=$(terraform output -raw cloudfront_domain_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(terraform output -raw api_endpoint 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "========================================="
          echo "✓ DEV Infrastructure Deployment Complete"
          echo "========================================="
          echo ""
          echo "CloudFront: ${{ steps.outputs.outputs.cloudfront_domain }}"
          echo "API: ${{ steps.outputs.outputs.api_endpoint }}"

  # =======================================
  # Deploy Infrastructure (PRD) - Requires Approval
  # =======================================
  deploy-infrastructure-prd:
    name: Deploy Infrastructure (PRD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-changes, restore-lambda-binaries, merge-lambda-artifacts]
    environment:
      name: prod
      # Manual approval configured in GitHub environment settings
    if: |
      always() &&
      needs.detect-changes.outputs.deploy-infrastructure == 'true' &&
      needs.detect-changes.outputs.target-env == 'prd' &&
      (needs.restore-lambda-binaries.outputs.cache-hit == 'true' || needs.merge-lambda-artifacts.result == 'success')
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download Lambda binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-binaries
          path: go-functions/bin

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformApply-PRD

      - name: Create Terraform plugin cache dir
        run: mkdir -p ${{ github.workspace }}/.terraform.d/plugin-cache

      - name: Cache Terraform providers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-

      - name: Get PRD credentials from SSM
        run: |
          ALARM_EMAIL=$(aws ssm get-parameter --name "/serverless-blog/prd/monitoring/alarm-email" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::$ALARM_EMAIL"
          echo "TF_VAR_alarm_email=$ALARM_EMAIL" >> $GITHUB_ENV
          CLOUDFLARE_TOKEN=$(aws ssm get-parameter --name "/serverless-blog/prd/cloudflare/apikey" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::$CLOUDFLARE_TOKEN"
          echo "TF_VAR_cloudflare_api_token=$CLOUDFLARE_TOKEN" >> $GITHUB_ENV
          echo "TF_VAR_enable_custom_domain=true" >> $GITHUB_ENV
          echo "✓ PRD credentials loaded from SSM"

      - name: Terraform Init
        working-directory: terraform/environments/prd
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -backend-config="bucket=terraform-state-${ACCOUNT_ID}"

      # Plan is run on PR by ci.yml's terraform-plan-prd job. We skip the
      # explicit plan step here to avoid duplication. `terraform apply
      # -auto-approve` will internally re-plan against current state and
      # apply atomically; the plan summary still appears in the apply log.
      - name: Terraform Apply
        working-directory: terraform/environments/prd
        run: |
          echo "========================================="
          echo "⚠️  Deploying to PRODUCTION Environment"
          echo "========================================="
          terraform apply -auto-approve
          echo "✓ PRODUCTION deployment complete"

      - name: Get Outputs
        id: outputs
        working-directory: terraform/environments/prd
        run: |
          echo "cloudfront_domain=$(terraform output -raw cloudfront_domain_name 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(terraform output -raw api_endpoint 2>/dev/null || echo 'N/A')" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "========================================="
          echo "✓ PRODUCTION Infrastructure Deployment Complete"
          echo "========================================="
          echo ""
          echo "CloudFront: ${{ steps.outputs.outputs.cloudfront_domain }}"
          echo "API: ${{ steps.outputs.outputs.api_endpoint }}"

  # =======================================
  # Build Frontend (Admin Site)
  # Public site is now handled by Astro SSG (build-astro job)
  # =======================================
  build-frontend-admin:
    name: Build Frontend (Admin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, deploy-infrastructure-dev, deploy-infrastructure-prd]
    environment: ${{ needs.detect-changes.outputs.github-env }}
    if: |
      always() &&
      needs.detect-changes.outputs.deploy-frontend == 'true' &&
      (needs.deploy-infrastructure-dev.result == 'success' || needs.deploy-infrastructure-dev.result == 'skipped') &&
      (needs.deploy-infrastructure-prd.result == 'success' || needs.deploy-infrastructure-prd.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-FrontendBuild-Admin

      - name: Get Cognito Config from SSM
        id: cognito
        run: |
          POOL_ID=$(aws ssm get-parameter --name "/serverless-blog/${{ needs.detect-changes.outputs.target-env }}/cognito/user-pool-id" --query "Parameter.Value" --output text)
          CLIENT_ID=$(aws ssm get-parameter --name "/serverless-blog/${{ needs.detect-changes.outputs.target-env }}/cognito/user-pool-client-id" --query "Parameter.Value" --output text)
          echo "user_pool_id=$POOL_ID" >> $GITHUB_OUTPUT
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup Bun + Install Dependencies (admin)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: frontend/admin

      - name: Set CloudFront URL
        id: cloudfront
        run: |
          if [ "${{ needs.detect-changes.outputs.target-env }}" == "prd" ]; then
            echo "url=https://boneofmyfallacy.net" >> $GITHUB_OUTPUT
          else
            echo "url=https://dev.boneofmyfallacy.net" >> $GITHUB_OUTPUT
          fi

      - name: Build
        working-directory: frontend/admin
        run: bun run build
        env:
          NODE_ENV: production
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cognito.outputs.user_pool_id }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ steps.cognito.outputs.client_id }}
          VITE_API_URL: "/api"
          VITE_CLOUDFRONT_URL: ${{ steps.cloudfront.outputs.url }}

      # ビルドが成功しても実行時に認証が全滅する壊れ方 (Cognito 設定の埋め込み
      # 漏れ / Amplify シングルトンの重複) を、デプロイ前に成果物から検出する
      - name: Verify build artifact
        working-directory: frontend/admin
        run: bun run verify:bundle
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cognito.outputs.user_pool_id }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ steps.cognito.outputs.client_id }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-admin-build
          path: frontend/admin/dist/
          retention-days: 1

  # =======================================
  # Deploy Admin Site (DEV)
  # Public site is deployed by deploy-astro-dev job
  # =======================================
  deploy-admin-dev:
    name: Deploy Admin (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, build-frontend-admin, deploy-infrastructure-dev]
    environment: dev
    if: |
      always() &&
      needs.detect-changes.outputs.deploy-frontend == 'true' &&
      needs.detect-changes.outputs.target-env == 'dev' &&
      needs.build-frontend-admin.result == 'success' &&
      (needs.deploy-infrastructure-dev.result == 'success' || needs.deploy-infrastructure-dev.result == 'skipped')
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-AdminDeploy-DEV

      - name: Get deployment config from SSM
        id: config
        run: |
          ADMIN_BUCKET=$(aws ssm get-parameter --name "/serverless-blog/${{ needs.detect-changes.outputs.target-env }}/storage/admin-site-bucket-name" --query "Parameter.Value" --output text)
          DIST_ID=$(aws ssm get-parameter --name "/serverless-blog/${{ needs.detect-changes.outputs.target-env }}/cdn/distribution-id" --query "Parameter.Value" --output text)
          echo "admin_bucket=$ADMIN_BUCKET" >> $GITHUB_OUTPUT
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT
          echo "✓ Retrieved deployment config from SSM"

      - name: Download Admin Site build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-admin-build
          path: admin-dist/

      - name: Deploy Admin Site to S3
        run: |
          # Admin files stored under /admin/ prefix to avoid CloudFront cache key collision
          echo "Deploying Admin Site to S3 (under /admin/ prefix)..."
          aws s3 sync admin-dist/ s3://${{ steps.config.outputs.admin_bucket }}/admin/ --delete
          echo "✓ Admin site deployed to ${{ steps.config.outputs.admin_bucket }}/admin/"

      - name: Invalidate CloudFront Cache (Admin paths only)
        run: |
          if [ -n "${{ steps.config.outputs.distribution_id }}" ]; then
            aws cloudfront create-invalidation --distribution-id "${{ steps.config.outputs.distribution_id }}" --paths "/admin/*"
            echo "✓ CloudFront cache invalidated for /admin/* (Distribution: ${{ steps.config.outputs.distribution_id }})"
          else
            echo "⚠ CloudFront distribution ID not found in SSM, skipping invalidation"
          fi

  # =======================================
  # Deploy Admin Site (PRD) - Requires Approval
  # Public site is deployed by deploy-astro-prd job
  # =======================================
  deploy-admin-prd:
    name: Deploy Admin (PRD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, build-frontend-admin, deploy-infrastructure-prd]
    environment:
      name: prod
    if: |
      always() &&
      needs.detect-changes.outputs.deploy-frontend == 'true' &&
      needs.detect-changes.outputs.target-env == 'prd' &&
      needs.build-frontend-admin.result == 'success' &&
      (needs.deploy-infrastructure-prd.result == 'success' || needs.deploy-infrastructure-prd.result == 'skipped')
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-AdminDeploy-PRD

      - name: Get deployment config from SSM
        id: config
        run: |
          ADMIN_BUCKET=$(aws ssm get-parameter --name "/serverless-blog/${{ needs.detect-changes.outputs.target-env }}/storage/admin-site-bucket-name" --query "Parameter.Value" --output text)
          DIST_ID=$(aws ssm get-parameter --name "/serverless-blog/${{ needs.detect-changes.outputs.target-env }}/cdn/distribution-id" --query "Parameter.Value" --output text)
          echo "admin_bucket=$ADMIN_BUCKET" >> $GITHUB_OUTPUT
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT
          echo "✓ Retrieved deployment config from SSM"

      - name: Download Admin Site build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-admin-build
          path: admin-dist/

      - name: Deploy Admin Site to S3
        run: |
          # Admin files stored under /admin/ prefix to avoid CloudFront cache key collision
          echo "⚠️ Deploying Admin Site to PRODUCTION S3 (under /admin/ prefix)..."
          aws s3 sync admin-dist/ s3://${{ steps.config.outputs.admin_bucket }}/admin/ --delete
          echo "✓ Admin site deployed to ${{ steps.config.outputs.admin_bucket }}/admin/"

      - name: Invalidate CloudFront Cache (Admin paths only)
        run: |
          if [ -n "${{ steps.config.outputs.distribution_id }}" ]; then
            aws cloudfront create-invalidation --distribution-id "${{ steps.config.outputs.distribution_id }}" --paths "/admin/*"
            echo "✓ CloudFront cache invalidated for /admin/* (Distribution: ${{ steps.config.outputs.distribution_id }})"
          else
            echo "⚠ CloudFront distribution ID not found in SSM, skipping invalidation"
          fi

  # =======================================
  # Build Astro SSG (Task 5.3)
  # Requirements: 9.3, 9.4, 9.7, 9.8, 9.10
  # =======================================
  build-astro:
    name: Build Astro SSG
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SSG build must run AFTER infrastructure is deployed because it fetches posts from the API
    needs: [detect-changes, deploy-infrastructure-dev, deploy-infrastructure-prd]
    environment: ${{ needs.detect-changes.outputs.github-env }}
    if: |
      always() &&
      needs.detect-changes.outputs.deploy-astro == 'true' &&
      (needs.deploy-infrastructure-dev.result == 'success' || needs.deploy-infrastructure-dev.result == 'skipped') &&
      (needs.deploy-infrastructure-prd.result == 'success' || needs.deploy-infrastructure-prd.result == 'skipped')
    steps:
      - name: Checkout code
        # Pin to specific commit SHA for security (Requirement 9.8)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure AWS credentials (OIDC)
        # OIDC authentication for temporary credentials (Requirement 9.4)
        # Pin to specific commit SHA for security (Requirement 9.8)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-AstroBuild

      - name: Get API URL from SSM
        id: api
        run: |
          # Retrieve API URL and mask sensitive values (Requirement 9.7)
          API_URL=$(aws ssm get-parameter --name "/serverless-blog/${{ needs.detect-changes.outputs.target-env }}/api/endpoint" --query "Parameter.Value" --output text 2>/dev/null || echo "/api")
          echo "::add-mask::$API_URL"
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "✓ API URL retrieved from SSM"

      - name: Setup Node.js
        # Pin to specific commit SHA for security (Requirement 9.8)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup Bun + Install Dependencies (public-astro)
        # Pin to specific commit SHA for security (Requirement 9.8)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: frontend/public-astro

      - name: Set site URL
        id: site
        run: |
          if [ "${{ needs.detect-changes.outputs.target-env }}" == "prd" ]; then
            echo "url=https://boneofmyfallacy.net" >> $GITHUB_OUTPUT
          else
            echo "url=https://dev.boneofmyfallacy.net" >> $GITHUB_OUTPUT
          fi

      - name: Build Astro project
        working-directory: frontend/public-astro
        # Requirement 9.10: API_URL as environment variable
        run: |
          echo "========================================="
          echo "Building Astro SSG"
          echo "========================================="
          bun run build
          echo "✓ Astro build complete"
          echo ""
          echo "Build artifacts:"
          ls -la dist/
          echo ""
          DIST_SIZE=$(du -sh dist/ | cut -f1)
          echo "Total size: $DIST_SIZE"
        env:
          NODE_ENV: production
          PUBLIC_API_URL: ${{ steps.api.outputs.api_url }}
          API_URL: ${{ steps.api.outputs.api_url }}
          SITE_URL: ${{ steps.site.outputs.url }}

      - name: Validate build output
        working-directory: frontend/public-astro
        run: |
          echo "Validating build output..."

          # Check required files exist
          REQUIRED_FILES=("dist/index.html" "dist/404.html" "dist/about/index.html")
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done

          # Check dist size < 50MB (Requirement 6.8)
          DIST_SIZE_BYTES=$(du -sb dist/ | cut -f1)
          MAX_SIZE=$((50 * 1024 * 1024))
          if [ "$DIST_SIZE_BYTES" -gt "$MAX_SIZE" ]; then
            echo "❌ Build size exceeds 50MB limit: $DIST_SIZE_BYTES bytes"
            exit 1
          fi
          echo "✓ Build size within 50MB limit"

          echo "✓ Build validation passed"

      - name: Upload build artifact
        # Pin to specific commit SHA for security (Requirement 9.8)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astro-build
          path: frontend/public-astro/dist/
          retention-days: 1

  # =======================================
  # Deploy Astro SSG (DEV)
  # Task 5.3: Requirements 9.3, 9.4, 9.7, 9.8, 9.9, 9.11
  # =======================================
  deploy-astro-dev:
    name: Deploy Astro SSG (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, build-astro, deploy-infrastructure-dev]
    environment: dev
    if: |
      always() &&
      needs.detect-changes.outputs.deploy-astro == 'true' &&
      needs.detect-changes.outputs.target-env == 'dev' &&
      needs.build-astro.result == 'success' &&
      (needs.deploy-infrastructure-dev.result == 'success' || needs.deploy-infrastructure-dev.result == 'skipped')
    steps:
      - name: Checkout code
        # Pin to specific commit SHA for security (Requirement 9.8)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure AWS credentials (OIDC)
        # OIDC authentication (Requirement 9.4)
        # Pin to specific commit SHA (Requirement 9.8)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-AstroDeploy-DEV

      - name: Get deployment config from SSM
        id: config
        run: |
          # Retrieve bucket and distribution IDs from SSM (Requirement 9.7: mask sensitive values)
          PUBLIC_BUCKET=$(aws ssm get-parameter --name "/serverless-blog/dev/storage/public-site-bucket-name" --query "Parameter.Value" --output text)
          echo "::add-mask::$PUBLIC_BUCKET"
          echo "bucket=$PUBLIC_BUCKET" >> $GITHUB_OUTPUT

          DIST_ID=$(aws ssm get-parameter --name "/serverless-blog/dev/cdn/distribution-id" --query "Parameter.Value" --output text)
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

          KVS_ARN=$(aws ssm get-parameter --name "/serverless-blog/dev/cdn/release-kvs-arn" --query "Parameter.Value" --output text)
          echo "kvs_arn=$KVS_ARN" >> $GITHUB_OUTPUT

          echo "✓ Retrieved deployment config from SSM"

      - name: Download Astro build artifact
        # Pin to specific commit SHA (Requirement 9.8)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: astro-build
          path: dist/

      - name: Setup Node.js
        # Pin to specific commit SHA (Requirement 9.8)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup Bun + Install Dependencies (deploy scripts)
        # Pin to specific commit SHA (Requirement 9.8)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: scripts/deploy

      - name: Deploy to S3 (Atomic Deployment)
        id: deploy
        working-directory: scripts/deploy
        run: |
          echo "========================================="
          echo "Deploying Astro SSG to DEV"
          echo "========================================="

          # Run atomic deployment (Requirement 9.2)
          # Timer start for Requirement 9.11 (5 min limit)
          START_TIME=$(date +%s)

          # Epoch-seconds revision keeps promotion monotonic across every
          # deployer sharing the KVS (CodeBuild rebuilds, local-deploy.sh).
          REVISION="r${START_TIME}-${GITHUB_SHA::12}"

          bun run cli.ts \
            --bucket "${{ steps.config.outputs.bucket }}" \
            --kvs-arn "${{ steps.config.outputs.kvs_arn }}" \
            --dist "../../dist" \
            --region "${{ env.AWS_REGION }}" \
            --revision "$REVISION"

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          echo ""
          echo "Deployment completed in ${DURATION}s"

          # Requirement 9.11: Check 5-minute limit (300s)
          if [ "$DURATION" -gt 300 ]; then
            echo "⚠️ Deployment exceeded 5-minute target (${DURATION}s)"
          else
            echo "✓ Deployment within 5-minute target"
          fi

      - name: Invalidate CloudFront Cache
        # Requirement 9.9: Invalidate changed paths
        run: |
          if [ -n "${{ steps.config.outputs.distribution_id }}" ]; then
            echo "Creating CloudFront invalidation..."
            # For SSG, we invalidate common paths instead of /*
            aws cloudfront create-invalidation \
              --distribution-id "${{ steps.config.outputs.distribution_id }}" \
              --paths "/" "/index.html" "/about/*" "/posts/*" "/sitemap*.xml" "/rss.xml"
            echo "✓ CloudFront cache invalidated"
          else
            echo "⚠️ CloudFront distribution not found, skipping invalidation"
          fi

      - name: Deployment Summary
        run: |
          echo "========================================="
          echo "✓ Astro SSG DEV Deployment Complete"
          echo "========================================="
          echo ""
          echo "Bucket: ${{ steps.config.outputs.bucket }}"
          echo "Distribution: ${{ steps.config.outputs.distribution_id }}"

  # =======================================
  # Deploy Astro SSG (PRD) - Requires Approval
  # Task 5.3: Requirements 9.3, 9.4, 9.7, 9.8, 9.9, 9.11
  # =======================================
  deploy-astro-prd:
    name: Deploy Astro SSG (PRD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, build-astro, deploy-infrastructure-prd]
    environment:
      name: prod
    if: |
      always() &&
      needs.detect-changes.outputs.deploy-astro == 'true' &&
      needs.detect-changes.outputs.target-env == 'prd' &&
      needs.build-astro.result == 'success' &&
      (needs.deploy-infrastructure-prd.result == 'success' || needs.deploy-infrastructure-prd.result == 'skipped')
    steps:
      - name: Checkout code
        # Pin to specific commit SHA (Requirement 9.8)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure AWS credentials (OIDC)
        # OIDC authentication (Requirement 9.4)
        # Pin to specific commit SHA (Requirement 9.8)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-AstroDeploy-PRD

      - name: Get deployment config from SSM
        id: config
        run: |
          # Retrieve bucket and distribution IDs from SSM (Requirement 9.7: mask sensitive values)
          PUBLIC_BUCKET=$(aws ssm get-parameter --name "/serverless-blog/prd/storage/public-site-bucket-name" --query "Parameter.Value" --output text)
          echo "::add-mask::$PUBLIC_BUCKET"
          echo "bucket=$PUBLIC_BUCKET" >> $GITHUB_OUTPUT

          DIST_ID=$(aws ssm get-parameter --name "/serverless-blog/prd/cdn/distribution-id" --query "Parameter.Value" --output text)
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

          KVS_ARN=$(aws ssm get-parameter --name "/serverless-blog/prd/cdn/release-kvs-arn" --query "Parameter.Value" --output text)
          echo "kvs_arn=$KVS_ARN" >> $GITHUB_OUTPUT

          echo "✓ Retrieved deployment config from SSM"

      - name: Download Astro build artifact
        # Pin to specific commit SHA (Requirement 9.8)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: astro-build
          path: dist/

      - name: Setup Node.js
        # Pin to specific commit SHA (Requirement 9.8)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup Bun + Install Dependencies (deploy scripts)
        # Pin to specific commit SHA (Requirement 9.8)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: scripts/deploy

      - name: Deploy to S3 (Atomic Deployment)
        id: deploy
        working-directory: scripts/deploy
        run: |
          echo "========================================="
          echo "⚠️ Deploying Astro SSG to PRODUCTION"
          echo "========================================="

          # Run atomic deployment (Requirement 9.2)
          # Timer start for Requirement 9.11 (5 min limit)
          START_TIME=$(date +%s)

          # Epoch-seconds revision keeps promotion monotonic across every
          # deployer sharing the KVS (CodeBuild rebuilds, local-deploy.sh).
          REVISION="r${START_TIME}-${GITHUB_SHA::12}"

          bun run cli.ts \
            --bucket "${{ steps.config.outputs.bucket }}" \
            --kvs-arn "${{ steps.config.outputs.kvs_arn }}" \
            --dist "../../dist" \
            --region "${{ env.AWS_REGION }}" \
            --revision "$REVISION"

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          echo ""
          echo "Deployment completed in ${DURATION}s"

          # Requirement 9.11: Check 5-minute limit (300s)
          if [ "$DURATION" -gt 300 ]; then
            echo "⚠️ Deployment exceeded 5-minute target (${DURATION}s)"
          else
            echo "✓ Deployment within 5-minute target"
          fi

      - name: Invalidate CloudFront Cache
        # Requirement 9.9: Invalidate changed paths
        run: |
          if [ -n "${{ steps.config.outputs.distribution_id }}" ]; then
            echo "Creating CloudFront invalidation..."
            # For SSG, we invalidate common paths instead of /*
            aws cloudfront create-invalidation \
              --distribution-id "${{ steps.config.outputs.distribution_id }}" \
              --paths "/" "/index.html" "/about/*" "/posts/*" "/sitemap*.xml" "/rss.xml"
            echo "✓ CloudFront cache invalidated"
          else
            echo "⚠️ CloudFront distribution not found, skipping invalidation"
          fi

      - name: Deployment Summary
        run: |
          echo "========================================="
          echo "✓ Astro SSG PRODUCTION Deployment Complete"
          echo "========================================="
          echo ""
          echo "Bucket: ${{ steps.config.outputs.bucket }}"
          echo "Distribution: ${{ steps.config.outputs.distribution_id }}"

  # =======================================
  # Post-Deploy E2E Tests (DEV only)
  # Runs real environment E2E tests against deployed DEV site
  # =======================================
  post-deploy-e2e-dev:
    name: Post-Deploy E2E Tests (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, deploy-infrastructure-dev, deploy-admin-dev, deploy-astro-dev]
    environment: dev
    # deploy-admin-dev / deploy-astro-dev はどちらも deploy-infrastructure-dev が
    # 'failure' でも 'skipped' 扱いになりうる (それぞれの if: が
    # `result == 'success' || result == 'skipped'` を許容するため)。そのため
    # 以前はインフラ deploy が失敗していても、admin/astro が skipped になるだけで
    # この E2E ジョブは実行され、更新されていない stale な環境に対してテストして
    # いた。deploy-infrastructure-dev を needs に加えて直接その result を参照し、
    # 'failure' のときだけ実行しないようにする。「何もインフラ変更が無く
    # deploy-infrastructure-dev 自体が skipped」という正当なケースは
    # `!= 'failure'` なので引き続き許容される。
    if: |
      always() &&
      needs.detect-changes.outputs.target-env == 'dev' &&
      needs.deploy-infrastructure-dev.result != 'failure' &&
      (needs.deploy-admin-dev.result == 'success' || needs.deploy-admin-dev.result == 'skipped') &&
      (needs.deploy-astro-dev.result == 'success' || needs.deploy-astro-dev.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Setup Bun + Install Dependencies (root)
        uses: ./.github/actions/setup-bun-deps
        with:
          working-directory: .

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-E2E-DEV

      - name: Get DEV environment config from SSM
        id: config
        run: |
          BASE_URL=$(aws ssm get-parameter --name "/serverless-blog/dev/cdn/public-url" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          BASIC_USER=$(aws ssm get-parameter --name "/serverless-blog/dev/basic-auth/username" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")
          BASIC_PASS=$(aws ssm get-parameter --name "/serverless-blog/dev/basic-auth/password" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")

          echo "::add-mask::$BASIC_USER"
          echo "::add-mask::$BASIC_PASS"

          # admin E2E がログインに使う Cognito テストユーザー (Issue #520)。
          # auth モジュールが create_e2e_test_user = true のときだけ作成するため、
          # 未整備の環境では空になり、該当テストは spec 側で skip される。
          E2E_ADMIN_EMAIL=$(aws ssm get-parameter --name "/serverless-blog/dev/e2e/admin-email" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")
          E2E_ADMIN_PASSWORD=$(aws ssm get-parameter --name "/serverless-blog/dev/e2e/admin-password" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "")

          echo "::add-mask::$E2E_ADMIN_EMAIL"
          echo "::add-mask::$E2E_ADMIN_PASSWORD"

          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT
          echo "basic_user=$BASIC_USER" >> $GITHUB_OUTPUT
          echo "basic_pass=$BASIC_PASS" >> $GITHUB_OUTPUT
          echo "e2e_admin_email=$E2E_ADMIN_EMAIL" >> $GITHUB_OUTPUT
          echo "e2e_admin_password=$E2E_ADMIN_PASSWORD" >> $GITHUB_OUTPUT

      # The SSM read above swallows errors, so an unreadable parameter used to
      # skip the E2E run silently and still report the job green. The cdn module
      # creates /serverless-blog/dev/cdn/public-url unconditionally, so an empty
      # value means the post-deploy verification did not happen at all. (#480)
      - name: Verify BASE_URL was resolved
        run: |
          if [ -z "${{ steps.config.outputs.base_url }}" ]; then
            echo "❌ BASE_URL is empty - could not read /serverless-blog/dev/cdn/public-url"
            echo "   Post-deploy verification cannot run, so this deploy is unverified."
            exit 1
          fi
          echo "✓ BASE_URL resolved"

      - name: Run Post-Deploy E2E Tests (Public)
        run: bun run test:e2e:aws -- --project=chromium --workers=1
        env:
          CI: true
          BASE_URL: ${{ steps.config.outputs.base_url }}
          DEV_BASIC_AUTH_USERNAME: ${{ steps.config.outputs.basic_user }}
          DEV_BASIC_AUTH_PASSWORD: ${{ steps.config.outputs.basic_pass }}
          VITE_ENABLE_MSW_MOCK: 'false'

      # playwright.aws.config.ts の html レポート出力先 (playwright-report-aws/) は
      # chromium / admin-chromium 両プロジェクトで共有されている。次のステップで
      # admin スイートを実行すると同じディレクトリが上書きされるため、この
      # Public 実行分は admin を走らせる前に必ずアップロードしておく。
      - name: Upload Public E2E Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-aws-public
          path: playwright-report-aws/
          retention-days: 3

      # commit deee4d8 は「16 admin spec のうち 12 件は post-deploy で AWS に対して
      # 実行する」という前提で PR CI から除外したが、実際には deploy.yml は
      # test:e2e:aws (project=chromium = home/article の public spec のみ) しか
      # 呼んでおらず、admin-chromium を実行する test:e2e:aws:admin はどこからも
      # 呼ばれていなかった。ここでその欠落を埋める。
      #
      # 現在の実行対象は admin-auth.spec.ts のみ。残りの spec は MSW のシード
      # データ前提のままで実環境では通らないため、その対応は Issue #520。
      #
      # continue-on-error: このジョブでは実行実績が浅く flakiness が未知数の
      # ため、暫定的に job を落とさない。傾向が分かって安定したら外す。
      - name: Run Post-Deploy E2E Tests (Admin)
        id: e2e_admin
        continue-on-error: true
        run: bun run test:e2e:aws:admin -- --workers=1
        env:
          CI: true
          BASE_URL: ${{ steps.config.outputs.base_url }}
          DEV_BASIC_AUTH_USERNAME: ${{ steps.config.outputs.basic_user }}
          DEV_BASIC_AUTH_PASSWORD: ${{ steps.config.outputs.basic_pass }}
          # 未設定なら spec 側でログインを要するテストが skip される (Issue #520)
          TEST_ADMIN_EMAIL: ${{ steps.config.outputs.e2e_admin_email }}
          TEST_ADMIN_PASSWORD: ${{ steps.config.outputs.e2e_admin_password }}
          VITE_ENABLE_MSW_MOCK: 'false'

      # continue-on-error: true だとジョブ/ワークフローが緑のままになり、失敗が
      # 埋もれてしまう。Step Summary に明示的に結果を書き出して見えるようにする。
      - name: Record Admin E2E outcome
        if: always()
        run: |
          {
            echo "## Post-Deploy E2E Tests (Admin, DEV)"
            if [ "${{ steps.e2e_admin.outcome }}" == "success" ]; then
              echo "✅ Admin E2E (against DEV) passed."
            else
              echo "❌ Admin E2E (against DEV) failed (outcome: ${{ steps.e2e_admin.outcome }})."
              echo "continue-on-error is set, so this job is still reported as passing overall. See the playwright-report-aws-admin artifact for details."
            fi
            echo ""
            echo "実行対象は admin-auth.spec.ts のみ。残りの admin spec の実環境対応は Issue #520。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Admin E2E Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-aws-admin
          path: playwright-report-aws/
          retention-days: 3

  # =======================================
  # Post-Deploy Smoke Test (PRD)
  # Production had no post-deploy verification at all, which is how #463
  # (every canonical / sitemap / RSS URL pointing at https://example.com)
  # went unnoticed. Plain HTTP checks only: prd has no Basic Auth and the
  # public site needs no AWS credentials, so this needs no environment gate.
  # =======================================
  post-deploy-smoke-prd:
    name: Post-Deploy Smoke Test (PRD)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, deploy-admin-prd, deploy-astro-prd]
    if: |
      always() &&
      needs.detect-changes.outputs.target-env == 'prd' &&
      (needs.deploy-admin-prd.result == 'success' || needs.deploy-admin-prd.result == 'skipped') &&
      (needs.deploy-astro-prd.result == 'success' || needs.deploy-astro-prd.result == 'skipped')
    env:
      # Deliberately literal, not read from SSM: comparing the live page against
      # the domain we EXPECT is what catches a misconfigured SITE_URL. An
      # SSM-derived expectation would agree with a broken deploy.
      SITE_URL: https://boneofmyfallacy.net

    steps:
      - name: Verify public site
        run: |
          set -uo pipefail
          FAILED=0

          check_status() {
            local path="$1"
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
              "${SITE_URL}${path}" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✓ ${path} → ${code}"
            else
              echo "❌ ${path} → ${code} (expected 200)"
              FAILED=1
            fi
          }

          echo "========================================="
          echo "Smoke test against ${SITE_URL}"
          echo "========================================="

          check_status "/"
          check_status "/sitemap-index.xml"
          check_status "/rss.xml"
          check_status "/robots.txt"

          echo ""
          echo "--- robots.txt points at our sitemap ---"
          ROBOTS=$(curl -sS --max-time 30 "${SITE_URL}/robots.txt" || echo "")
          if echo "$ROBOTS" | grep -qF "Sitemap: ${SITE_URL}/sitemap-index.xml"; then
            echo "✓ Sitemap line references ${SITE_URL}"
          else
            echo "❌ robots.txt has no 'Sitemap: ${SITE_URL}/sitemap-index.xml' line"
            echo "$ROBOTS"
            FAILED=1
          fi

          echo ""
          echo "--- canonical / og:url use the production domain ---"
          HOME_HTML=$(curl -sS --max-time 30 "${SITE_URL}/" || echo "")

          CANONICAL=$(echo "$HOME_HTML" | grep -o '<link rel="canonical" href="[^"]*"' | head -1)
          OG_URL=$(echo "$HOME_HTML" | grep -o '<meta property="og:url" content="[^"]*"' | head -1)

          for tag in "$CANONICAL" "$OG_URL"; do
            if [ -z "$tag" ]; then
              echo "❌ Missing canonical or og:url tag on the home page"
              FAILED=1
            elif echo "$tag" | grep -qF "example.com"; then
              echo "❌ ${tag} — SITE_URL fell back to the example.com placeholder"
              FAILED=1
            elif echo "$tag" | grep -qF "${SITE_URL}"; then
              echo "✓ ${tag}"
            else
              echo "❌ ${tag} — does not reference ${SITE_URL}"
              FAILED=1
            fi
          done

          echo ""
          echo "--- a real article page renders ---"
          RSS=$(curl -sS --max-time 30 "${SITE_URL}/rss.xml" || echo "")
          # An empty feed is valid. Keep grep's expected no-match status from
          # tripping GitHub Actions' implicit `bash -e` together with pipefail.
          ARTICLE_URL=$(echo "$RSS" \
            | grep -o '<link>[^<]*/posts/[^<]*</link>' \
            | head -1 | sed -e 's|<link>||' -e 's|</link>||' \
            || true)

          if [ -z "$ARTICLE_URL" ]; then
            echo "⚠️ No article found in the RSS feed - skipping article check"
          else
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
              "$ARTICLE_URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✓ ${ARTICLE_URL} → ${code}"
            else
              echo "❌ ${ARTICLE_URL} → ${code} (expected 200)"
              FAILED=1
            fi
          fi

          echo ""
          if [ "$FAILED" = "1" ]; then
            echo "❌ Production smoke test failed"
            exit 1
          fi
          echo "========================================="
          echo "✓ Production smoke test passed"
          echo "========================================="

  # =======================================
  # Deployment Summary
  # =======================================
  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
      - deploy-infrastructure-dev
      - deploy-infrastructure-prd
      - deploy-admin-dev
      - deploy-admin-prd
      - deploy-astro-dev
      - deploy-astro-prd
      - post-deploy-e2e-dev
      - post-deploy-smoke-prd
    if: always()
    steps:
      - name: Summary
        run: |
          echo "========================================="
          echo "Deployment Summary"
          echo "========================================="
          echo ""
          echo "Target Environment: ${{ needs.detect-changes.outputs.target-env }}"
          echo ""
          echo "--- Infrastructure ---"
          echo "  DEV: ${{ needs.deploy-infrastructure-dev.result }}"
          echo "  PRD: ${{ needs.deploy-infrastructure-prd.result }}"
          echo ""
          echo "--- Admin Site ---"
          echo "  DEV: ${{ needs.deploy-admin-dev.result }}"
          echo "  PRD: ${{ needs.deploy-admin-prd.result }}"
          echo ""
          echo "--- Public Site (Astro SSG) ---"
          echo "  DEV: ${{ needs.deploy-astro-dev.result }}"
          echo "  PRD: ${{ needs.deploy-astro-prd.result }}"
          echo ""
          echo "--- Post-Deploy Verification ---"
          echo "  DEV (E2E):   ${{ needs.post-deploy-e2e-dev.result }}"
          echo "  PRD (smoke): ${{ needs.post-deploy-smoke-prd.result }}"
          echo ""
          echo "========================================="

          # Check for failures
          if [ "${{ needs.deploy-infrastructure-dev.result }}" == "failure" ] || \
             [ "${{ needs.deploy-infrastructure-prd.result }}" == "failure" ] || \
             [ "${{ needs.deploy-admin-dev.result }}" == "failure" ] || \
             [ "${{ needs.deploy-admin-prd.result }}" == "failure" ] || \
             [ "${{ needs.deploy-astro-dev.result }}" == "failure" ] || \
             [ "${{ needs.deploy-astro-prd.result }}" == "failure" ] || \
             [ "${{ needs.post-deploy-e2e-dev.result }}" == "failure" ] || \
             [ "${{ needs.post-deploy-smoke-prd.result }}" == "failure" ]; then
            echo "❌ One or more deploy or verification steps failed"
            exit 1
          fi

          echo "✓ All deployments and post-deploy checks completed successfully!"
