name: Weekly Production Release

on:
  schedule:
    # Saturday 09:00 Asia/Tokyo. GitHub may delay scheduled execution.
    - cron: '0 0 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: weekly-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout trusted controller only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      # Same repository-scoped App; no bypass or extra permissions. A manual run
      # only reads. App authentication is needed to inspect classic protection.
      - name: Create repository-scoped release token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPENDABOT_AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTOMERGE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ github.event_name == 'schedule' && vars.WEEKLY_RELEASE_MODE == 'enabled' && 'write' || 'read' }}
          permission-pull-requests: ${{ github.event_name == 'schedule' && vars.WEEKLY_RELEASE_MODE == 'enabled' && 'write' || 'read' }}
          permission-actions: read
          permission-checks: read
          permission-administration: read
      - name: Prepare and verify the pinned weekly release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          WEEKLY_RELEASE_MODE: ${{ vars.WEEKLY_RELEASE_MODE }}
        run: python3 scripts/ci/weekly_release.py
