# Repository-wide vulnerability scanning workflow.
#
# Scope: secrets (gitleaks), SAST (CodeQL), dependency vulns + secrets (Trivy fs).
# Checkov for Terraform stays in ci.yml (label-conditional) and uploads its own SARIF.
#
# Findings remain visible during baseline review. Scanner and upload errors fail.
# Scheduled runs scan both deploy branches at fixed SHAs.

name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Mon 03:00 JST (Sun 18:00 UTC) — catches CVEs disclosed against unchanged code
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-targets:
    name: Select immutable scan targets
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          if os.environ['EVENT_NAME'] == 'schedule':
              targets = []
              for branch in ['develop', 'main']:
                  sha = subprocess.check_output([
                      'gh', 'api', f"repos/{os.environ['REPOSITORY']}/git/ref/heads/{branch}",
                      '--jq', '.object.sha',
                  ], text=True).strip()
                  targets.append({'name': branch, 'ref': f'refs/heads/{branch}', 'sha': sha})
          else:
              targets = [{'name': 'event', 'ref': os.environ['EVENT_REF'], 'sha': os.environ['EVENT_SHA']}]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps(targets) + '\n')
          PYTHON

  # =======================================
  # Job: gitleaks - secret scanning across full git history
  # We use the gitleaks CLI directly (not gitleaks-action) because
  # gitleaks-action requires a paid license for organization repos.
  # The CLI is OSS (MIT) and produces the same SARIF output.
  # =======================================
  gitleaks:
    name: Gitleaks (secrets)
    needs: scan-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.scan-targets.outputs.targets) }}
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.24.3'
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.target.sha }}
          fetch-depth: 0

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        # Phase 1 stance: --exit-code 0 keeps the step green even when leaks are
        # detected. Findings still land in the SARIF and surface in the Security
        # tab. In Phase 3 flip back to --exit-code 1 to enforce.
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --redact=100 \
            --log-opts="--full-history HEAD" \
            --verbose \
            --exit-code 0

      - name: Verify Gitleaks SARIF was generated
        run: test -s gitleaks.sarif

      - name: Upload gitleaks SARIF to Code Scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: gitleaks.sarif
          ref: ${{ matrix.target.ref }}
          sha: ${{ matrix.target.sha }}
          category: gitleaks

      - name: Upload gitleaks SARIF as artifact
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif-${{ matrix.target.name }}
          path: gitleaks.sarif
          retention-days: 3

  # =======================================
  # Job: CodeQL - SAST for Go and JavaScript/TypeScript
  # JS/TS uses build-mode none; Go uses autobuild with the go.mod toolchain.
  # =======================================
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: scan-targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.scan-targets.outputs.targets) }}
        language: [go, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.target.sha }}

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go-functions/go.mod
          check-latest: false
          cache-dependency-path: go-functions/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          ref: ${{ matrix.target.ref }}
          sha: ${{ matrix.target.sha }}
          category: /language:${{ matrix.language }}

  # =======================================
  # Job: Trivy filesystem scan (all four Bun lockfiles and Go, plus secrets).
  # Findings are non-blocking until the documented clean-baseline period completes.
  # Scanner failures and SARIF upload errors are always blocking.
  # =======================================
  trivy-fs:
    name: Trivy (filesystem)
    needs: scan-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.scan-targets.outputs.targets) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.target.sha }}

      - name: Run Trivy filesystem scan
        id: trivy
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          scanners: 'vuln,secret'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          version: 'v0.70.0'
          exit-code: '0'
          # 到達不能と判断した指摘を根拠付きで抑制する。
          # 抑制理由は .trivyignore 側にコメントで記載すること。
          trivyignores: '.trivyignore'

      - name: Verify SARIF was generated
        run: test -s trivy-fs.sarif

      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-fs.sarif
          ref: ${{ matrix.target.ref }}
          sha: ${{ matrix.target.sha }}
          category: trivy-fs

      - name: Upload Trivy SARIF as artifact
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-fs-sarif-${{ matrix.target.name }}
          path: trivy-fs.sarif
          retention-days: 3

  dependency-audit:
    name: Bun and Go dependency audit
    needs: scan-targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.scan-targets.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.target.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Audit all Bun lockfiles
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, subprocess
          for directory in ['.', 'frontend/admin', 'frontend/public-astro', 'scripts/deploy']:
              if not (pathlib.Path(directory) / 'bun.lock').is_file():
                  raise SystemExit(f'Missing bun.lock in {directory}')
              result = subprocess.run(['bun', 'audit', '--json'], cwd=directory, capture_output=True, text=True)
              try:
                  data = json.loads(result.stdout)
              except json.JSONDecodeError:
                  raise SystemExit(f'Bun audit produced no valid report in {directory}: exit {result.returncode}')
              if result.returncode not in [0, 1] or not isinstance(data, dict):
                  raise SystemExit(f'Bun audit failed in {directory}: exit {result.returncode}')
              if any(not isinstance(items, list) for items in data.values()):
                  raise SystemExit(f'Bun audit error response in {directory}')
              count = sum(len(items) for items in data.values())
              if (result.returncode == 0) != (count == 0):
                  raise SystemExit(f'Bun audit exit/report mismatch in {directory}')
              for items in data.values():
                  for item in items:
                      if not isinstance(item, dict) or item.get('severity') not in ['low', 'moderate', 'high', 'critical']:
                          raise SystemExit(f'Invalid Bun advisory in {directory}')
              name = directory.replace('/', '-') if directory != '.' else 'root'
              pathlib.Path(f'bun-audit-{name}.json').write_text(json.dumps(data, indent=2))
              print(f'{directory}: {count} dependency advisories')
              if count:
                  print(f'::warning title=Dependency findings::{directory}: {count} advisories; see artifact')
          PYTHON
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go-functions/go.mod
          cache-dependency-path: go-functions/go.sum
      - name: Install govulncheck
        working-directory: go-functions
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Audit Go call paths
        working-directory: go-functions
        run: |
          status=0
          govulncheck ./... > ../govulncheck.txt 2>&1 || status=$?
          cat ../govulncheck.txt
          case "$status" in
            0) ;;
            3) echo '::warning title=Go vulnerability findings::See govulncheck artifact; findings remain non-blocking during baseline review.' ;;
            *) exit "$status" ;;
          esac
      - name: Preserve dependency reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ matrix.target.name }}
          path: |
            bun-audit-*.json
            govulncheck.txt
          if-no-files-found: error
          retention-days: 7

  # =======================================
  # Job: Summary (fails on missing or failed scanners/uploads)
  # =======================================
  security-scan-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scan-targets, gitleaks, codeql, trivy-fs, dependency-audit]
    if: always()
    steps:
      - name: Render summary
        run: |
          {
            echo "# Security Scan Summary"
            echo ""
            echo "| Scanner | Result |"
            echo "|---------|--------|"
            echo "| Gitleaks (secrets) | ${{ needs.gitleaks.result }} |"
            echo "| CodeQL | ${{ needs.codeql.result }} |"
            echo "| Trivy (fs) | ${{ needs.trivy-fs.result }} |"
            echo "| Bun / Go audit | ${{ needs.dependency-audit.result }} |"
            echo ""
            echo "Findings appear in **Security → Code scanning** under the categories: \`gitleaks\`, \`/language:go\`, \`/language:javascript-typescript\`, \`trivy-fs\`."
            echo ""
            echo "Phase 1 stance is visibility-first; see \`docs/SECURITY_SCANNING.md\` for the hard-fail roadmap."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful scanners and uploads
        env:
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          TARGETS_RESULT: ${{ needs.scan-targets.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy-fs.result }}
        run: |
          for result in "$TARGETS_RESULT" "$GITLEAKS_RESULT" "$CODEQL_RESULT" "$TRIVY_RESULT" "$AUDIT_RESULT"; do
            test "$result" = success || exit 1
          done
