<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link id="site-favicon" rel="icon" type="image/png" href="/favicon-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preload Shippori Mincho (self-hosted). 公開サイト (public-astro) と同じ
         本文書体を管理画面でも使うため、Google Fonts ではなく自前配信する。 -->
    <link rel="preload" href="/fonts/shippori-mincho-400.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Theme bootstrap (FOUC prevention). Mirrors public-astro Layout. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved !== 'light' && saved !== 'dark' && saved !== 'system') {
            saved = 'system';
          }
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = saved === 'system' ? (prefersDark ? 'dark' : 'light') : saved;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Theme-aware favicon. Mirrors public-astro Layout. -->
    <script>
      (function () {
        var favicon = document.getElementById('site-favicon');
        if (!favicon) return;

        var syncFavicon = function () {
          var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          favicon.setAttribute('href', isDark ? '/favicon-dark.png' : '/favicon-light.png');
        };

        syncFavicon();
        new MutationObserver(syncFavicon).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['data-theme'],
        });
      })();
    </script>

    <title>Bone of my fallacy - Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
